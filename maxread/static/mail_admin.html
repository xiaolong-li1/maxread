<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MaxRead 邮件机器人</title>
  <style>
    :root { --bg:#f5f7f4; --paper:#fff; --text:#202621; --muted:#6f7871; --line:#dce2dd; --green:#1f755d; --green-soft:#e8f2ee; --orange:#b86c24; --orange-soft:#f8eee3; --red:#b44037; --red-soft:#faecea; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:24px 0 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    h1,h2 { margin:0; letter-spacing:0; }
    h1 { font-size:24px; }
    h2 { font-size:16px; }
    .sub,.muted { color:var(--muted); }
    .actions,.inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    a.button,button { min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 12px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; text-decoration:none; }
    button.primary { color:#fff; background:var(--green); border-color:var(--green); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin:18px 0; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:8px; }
    .status.degraded { border-left-color:var(--orange); }
    .status.down { border-left-color:var(--red); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
    .degraded .dot { background:var(--orange); }
    .down .dot { background:var(--red); }
    .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px; }
    .card { grid-column:span 6; min-width:0; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:8px; }
    .wide { grid-column:1/-1; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    #overview-metrics { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:14px; }
    .metric { padding-top:9px; border-top:2px solid var(--line); }
    .metric strong { display:block; margin-top:3px; font-size:19px; font-variant-numeric:tabular-nums; }
    .account-list { display:grid; gap:10px; }
    .account { display:grid; grid-template-columns:minmax(210px,1.5fr) repeat(3,minmax(90px,.7fr)) auto; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
    .account:first-child { border-top:0; padding-top:0; }
    .address { overflow-wrap:anywhere; font-weight:650; }
    label.field { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    input[type=number] { width:100%; height:38px; padding:0 10px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .config { display:grid; grid-template-columns:1fr 1fr auto; align-items:end; gap:12px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 9px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-size:12px; font-weight:600; }
    .pill { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:12px; color:var(--green); background:var(--green-soft); }
    .pill.bad { color:var(--red); background:var(--red-soft); }
    .pill.warn { color:var(--orange); background:var(--orange-soft); }
    .error-list { display:grid; gap:8px; }
    .table-links { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--line); }
    .table-link { min-height:68px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); text-decoration:none; }
    .table-link:nth-child(odd) { padding-right:18px; }
    .table-link:nth-child(even) { padding-left:18px; border-left:1px solid var(--line); }
    .table-link strong { display:block; }
    .table-link span { color:var(--muted); font-size:12px; }
    .table-link b { color:var(--green); font-size:18px; font-weight:500; }
    .record-toolbar { display:grid; grid-template-columns:minmax(190px,1.4fr) repeat(4,minmax(120px,.7fr)); gap:8px; margin:12px 0; }
    .record-toolbar input,.record-toolbar select,.workflow-select { width:100%; height:36px; padding:0 9px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:6px; }
    .record-table { min-width:1240px; }
    .record-table th { position:sticky; top:0; z-index:1; background:var(--paper); }
    .record-table td { vertical-align:top; white-space:normal; }
    .record-table .when { width:118px; white-space:nowrap; }
    .record-table .person { width:180px; }
    .record-table .study { width:220px; }
    .record-table .summary { min-width:260px; max-width:360px; color:#4f5851; }
    .record-table .workflow { width:142px; }
    .person-button { padding:0; min-height:0; justify-content:flex-start; color:var(--green); background:transparent; border:0; font-weight:680; text-align:left; }
    .person-meta,.cell-note { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .tags { display:flex; flex-wrap:wrap; gap:4px; }
    .tag { display:inline-flex; padding:2px 6px; color:#315f50; background:var(--green-soft); border-radius:4px; font-size:11px; }
    .assigned { display:inline-flex; align-items:center; gap:6px; min-height:36px; white-space:nowrap; }
    .assigned input { width:16px; height:16px; accent-color:var(--green); }
    .row-actions { display:flex; gap:5px; }
    .row-actions a,.row-actions button { width:34px; min-height:34px; padding:0; }
    .pager { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; }
    .pager span { color:var(--muted); font-size:12px; }
    dialog { width:min(720px,calc(100vw - 28px)); padding:0; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 24px 80px rgba(26,31,27,.24); }
    dialog::backdrop { background:rgba(30,36,32,.35); }
    .detail { padding:20px; }
    .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .detail-head button { min-height:32px; padding:0 9px; }
    .detail-grid { display:grid; grid-template-columns:150px minmax(0,1fr); gap:0; margin-top:8px; }
    .detail-grid dt,.detail-grid dd { margin:0; padding:9px 4px; border-bottom:1px solid var(--line); }
    .detail-grid dt { color:var(--muted); }
    .detail-grid dd { white-space:pre-wrap; overflow-wrap:anywhere; }
    .error-row { display:grid; grid-template-columns:56px minmax(0,1fr) 150px; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
    .empty { padding:24px; color:var(--muted); text-align:center; }
    .auth { margin-top:80px; padding:28px; text-align:center; background:var(--paper); border:1px solid var(--line); border-radius:8px; }
    .hidden { display:none !important; }
    .toast { position:fixed; right:20px; bottom:20px; padding:10px 13px; color:#fff; background:#202621; border-radius:7px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:none; }
    @media (max-width:760px) { .wrap{width:min(100% - 20px,1180px);padding-top:14px;} header{align-items:flex-start;flex-direction:column;} .card{grid-column:1/-1;} .account{grid-template-columns:1fr 1fr;} .account .address{grid-column:1/-1;} .config{grid-template-columns:1fr;} .metric-grid,#overview-metrics{grid-template-columns:1fr 1fr;} .error-row{grid-template-columns:44px 1fr;} .error-row .time{display:none;} .table-links{grid-template-columns:1fr;} .table-link:nth-child(n){padding-left:4px;padding-right:4px;border-left:0;} .record-toolbar{grid-template-columns:1fr 1fr;} .record-toolbar input{grid-column:1/-1;} .record-table{display:block;min-width:0;} .record-table thead{display:none;} .record-table tbody{display:block;} .record-table tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 0;border-bottom:1px solid var(--line);} .record-table td{display:block;padding:0;border:0;width:auto!important;min-width:0;} .record-table td:nth-child(3),.record-table td:nth-child(4),.record-table td:nth-child(5){display:none;} .record-table td:nth-child(6){grid-column:1/-1;} .record-table td:nth-child(7),.record-table td:nth-child(8){padding-top:4px;} .record-table td:nth-child(9){grid-column:1/-1;} .record-table td:nth-child(6)::before,.record-table td:nth-child(7)::before,.record-table td:nth-child(8)::before{display:block;margin-bottom:4px;color:var(--muted);font-size:11px;} .record-table td:nth-child(6)::before{content:'筛选状态';}.record-table td:nth-child(7)::before{content:'分配面试';}.record-table td:nth-child(8)::before{content:'面试结果';}.record-table .workflow-select{height:38px;} .detail-grid{grid-template-columns:110px minmax(0,1fr);} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>邮件机器人</h1><div class="sub" id="execution-host">MaxRead Recruiting Mail</div></div>
      <div class="actions"><a class="button" href="admin">返回控制台</a><button onclick="refreshAll(true)">刷新</button></div>
    </header>
    <section id="auth" class="auth hidden"><h2>需要管理员登录</h2><p class="muted">登录成功后会自动返回本页。</p><a class="button" href="admin?next=mail">前往登录</a></section>
    <main id="dashboard" class="hidden">
      <section id="status" class="status"><div class="inline"><span class="dot"></span><strong id="status-label">读取中</strong></div><span class="muted" id="status-detail"></span></section>
      <div class="grid">
        <section class="card wide">
          <div class="card-head"><div><h2>表格入口</h2><div class="muted">候选池、最近新增、其他邮件与方向视图</div></div><span class="muted" id="overview-updated"></span></div>
          <div class="metric-grid" id="overview-metrics"></div>
          <div class="table-links" id="table-links"></div>
        </section>
        <section class="card wide">
          <div class="card-head"><div><h2>邮件记录</h2><div class="muted">查看最近来信并维护候选筛选状态</div></div><span class="muted" id="record-count"></span></div>
          <div class="record-toolbar">
            <input id="record-search" type="search" placeholder="搜索姓名、学校、邮箱、方向" oninput="queueRecordLoad()" />
            <select id="record-type" onchange="resetAndLoadRecords()"><option value="candidate">候选人来信</option><option value="other">其他邮件</option><option value="all">全部邮件</option></select>
            <select id="record-status" onchange="resetAndLoadRecords()"><option value="">全部筛选状态</option></select>
            <select id="record-project" onchange="resetAndLoadRecords()"><option value="">全部方向</option></select>
            <select id="record-days" onchange="resetAndLoadRecords()"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option><option value="0">全部时间</option></select>
          </div>
          <div class="table-wrap"><table class="record-table"><thead><tr><th>时间</th><th>候选人 / 邮箱</th><th>院校 / 学业</th><th>方向</th><th>摘要</th><th>筛选状态</th><th>分配面试</th><th>面试结果</th><th></th></tr></thead><tbody id="record-rows"></tbody></table></div>
          <div class="pager"><button id="record-prev" onclick="changeRecordPage(-1)">上一页</button><span id="record-page"></span><button id="record-next" onclick="changeRecordPage(1)">下一页</button></div>
        </section>
        <section class="card wide">
          <div class="card-head"><div><h2>邮箱</h2><div class="muted" id="control-state"></div></div><button class="primary" id="scan-all" onclick="scanMailbox('all')">扫描全部</button></div>
          <div class="account-list" id="accounts"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>自动任务</h2><span class="pill" id="service-pill">未知</span></div>
          <div class="metric-grid" id="service-metrics"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>候选处理</h2><span class="pill" id="run-pill">未知</span></div>
          <div class="metric-grid" id="run-metrics"></div>
        </section>
        <section class="card wide">
          <div class="card-head"><h2>调度配置</h2><span class="muted">保存后重启对应 systemd 单元</span></div>
          <div class="config">
            <label class="field">自动扫描/候选发布间隔（分钟）<input id="scan-interval" type="number" min="5" max="10080" step="5" /></label>
            <label class="field">周报发布间隔（小时）<input id="report-interval" type="number" min="1" max="720" step="1" /></label>
            <button class="primary" id="save-config" onclick="saveConfig()">保存配置</button>
          </div>
        </section>
        <section class="card wide">
          <div class="card-head"><h2>最近运行</h2><span class="muted" id="run-count"></span></div>
          <div class="table-wrap"><table><thead><tr><th>开始</th><th>状态</th><th>邮件</th><th>新增</th><th>更新</th><th>失败</th><th>耗时</th></tr></thead><tbody id="runs"></tbody></table></div>
        </section>
        <section class="card wide">
          <div class="card-head"><h2>近期错误</h2><span class="muted">按相同错误聚合</span></div>
          <div class="error-list" id="errors"></div>
        </section>
      </div>
    </main>
  </div>
  <dialog id="record-dialog"><div class="detail"><div class="detail-head"><div><h2 id="detail-title"></h2><div class="muted" id="detail-subtitle"></div></div><button onclick="document.getElementById('record-dialog').close()">关闭</button></div><dl class="detail-grid" id="detail-grid"></dl></div></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = value => value ? new Intl.DateTimeFormat('zh-CN',{dateStyle:'short',timeStyle:'medium'}).format(new Date(value)) : '—';
    const duration = (start,end) => { if(!start||!end)return '—'; const s=Math.max(0,(new Date(end)-new Date(start))/1000); return s<60?`${Math.round(s)} 秒`:`${Math.round(s/60)} 分钟`; };
    async function api(path,options={}) { const response=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},...options}); const body=await response.json().catch(()=>({})); if(!response.ok){const e=new Error(body.error||`HTTP ${response.status}`);e.status=response.status;throw e;} return body; }
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200);}
    function metric(label,value){return `<div class="metric"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong></div>`;}
    function pill(status,bad=false,warn=false){return `<span class="pill ${bad?'bad':warn?'warn':''}">${esc(status)}</span>`;}
    const recordState={items:[],offset:0,limit:30,total:0,timer:null,filters:null};
    const selectOptions=(values,current)=>values.map(value=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(value)}</option>`).join('');
    async function loadStatus(announce=false){
      try{
        const data=await api('api/admin/mail/status');
        $('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');render(data);if(announce)toast('已刷新 5090 实时状态');
      }catch(error){
        $('dashboard').classList.add('hidden');$('auth').classList.remove('hidden');
        if(error.status===401)return;
        $('auth').querySelector('p').textContent=`状态加载失败：${error.message}`;
        toast(error.message);
      }
    }
    function render(data){
      $('execution-host').textContent=data.remote_execution&&data.execution_host?`MaxRead Recruiting Mail · 执行节点 ${data.execution_host}`:'MaxRead Recruiting Mail';
      const latest=data.runs?.[0]||{}; const state=data.business_state||'down';
      const active=Boolean(data.control?.active);
      $('status').className=`status ${state}`;$('status-label').textContent=state==='healthy'?'运行正常':state==='scanning'?'手动扫描中':state==='degraded'?'进程正常，业务降级':'服务异常';
      const changed=Number(latest.new_threads||0)+Number(latest.updated_threads||0); const latestFailed=Number(latest.failed_threads||0);
      $('status-detail').textContent=active?`正在扫描${data.control.account==='all'?'全部邮箱':data.control.account||''}，结束后自动恢复常驻任务`:latest.started_at?`最近运行 ${fmt(latest.started_at)}${latestFailed?` · ${latestFailed}/${changed||latestFailed} 失败`:''}`:'暂无运行记录';
      const overview=data.overview||{};const metrics=overview.metrics||{};
      $('overview-updated').textContent=overview.updated_at?`更新至 ${overview.updated_at}`:'';
      $('overview-metrics').innerHTML=metric('候选人',metrics.candidate_total||0)+metric('未筛选',metrics.unscreened||0)+metric('最近一周新增',metrics.recent_candidates||0)+metric('其他邮件',metrics.other_total||0);
      $('table-links').innerHTML=(overview.links||[]).map(link=>`<a class="table-link" href="${esc(link.url)}" target="_blank" rel="noopener"><div><strong>${esc(link.title)}</strong><span>${esc(link.description)}</span></div><b>↗</b></a>`).join('')||'<div class="empty">暂无表格入口</div>';
      $('control-state').textContent=active?`后台任务：${data.control.account==='all'?'全部邮箱':data.control.account||'手动扫描'}`:'当前没有手动扫描';$('scan-all').disabled=active;
      $('accounts').innerHTML=(data.accounts||[]).map(a=>`<div class="account"><div><div class="address">${esc(a.address)}</div><div class="muted">${esc(a.id)}</div></div><div><span class="muted">邮件</span><br><strong>${Number(a.messages||0)}</strong></div><div><span class="muted">最近扫描</span><br>${esc(fmt(a.last_scan))}</div><div><span class="muted">最新来信</span><br>${esc(fmt(a.latest_mail))}</div><button ${active?'disabled':''} onclick="scanMailbox('${esc(a.id)}')">立即扫描</button></div>`).join('')||'<div class="empty">未发现邮箱配置</div>';
      const serviceActive=data.service?.ActiveState==='active';const serviceLabel=active?'手动扫描接管':serviceActive?'active':data.service?.ActiveState||'unknown';$('service-pill').outerHTML=pill(serviceLabel,!serviceActive&&!active,active).replace('<span','<span id="service-pill"');
      $('service-metrics').innerHTML=metric('PID',data.service?.MainPID||'—')+metric('重启次数',data.service?.NRestarts||0)+metric('周报下次',fmt(data.report_timer?.NextElapseUSecRealtimeISO));
      const failed=Number(latest.failed_threads||0); const runLabel=latest.status==='completed'&&failed?'部分失败':latest.status||'暂无';$('run-pill').outerHTML=pill(runLabel,latest.status==='failed',failed>0).replace('<span','<span id="run-pill"');
      $('run-metrics').innerHTML=metric('邮件会话',data.thread_stats?.active||0)+metric('提取失败待重试',data.thread_stats?.extract_failed||0)+metric('本轮失败',failed);
      $('scan-interval').value=data.config?.scan_interval_minutes||1440;$('report-interval').value=data.config?.report_interval_hours||168;
      $('run-count').textContent=`${(data.runs||[]).length} 条`;
      $('runs').innerHTML=(data.runs||[]).map(r=>`<tr><td>${esc(fmt(r.started_at))}</td><td>${pill(r.status,r.status==='failed'||r.status==='abandoned',Number(r.failed_threads)>0)}</td><td>${Number(r.scanned_messages||0)}</td><td>${Number(r.new_threads||0)}</td><td>${Number(r.updated_threads||0)}</td><td>${Number(r.failed_threads||0)}</td><td>${esc(duration(r.started_at,r.finished_at))}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无运行</td></tr>';
      $('errors').innerHTML=(data.errors||[]).map(e=>`<div class="error-row"><strong>${Number(e.count||0)}</strong><span>${esc(e.error||'未知错误')}</span><span class="time muted">${esc(fmt(e.last_seen))}</span></div>`).join('')||'<div class="empty">没有近期错误</div>';
    }
    async function loadRecords(){
      const params=new URLSearchParams({q:$('record-search').value.trim(),mail_type:$('record-type').value,screening:$('record-status').value,project:$('record-project').value,days:$('record-days').value,offset:String(recordState.offset),limit:String(recordState.limit)});
      try{
        const data=await api(`api/admin/mail/records?${params}`);recordState.items=data.items||[];recordState.total=Number(data.total||0);recordState.filters=data.filters||recordState.filters||{};
        const currentStatus=$('record-status').value;const currentProject=$('record-project').value;
        $('record-status').innerHTML='<option value="">全部筛选状态</option>'+selectOptions(recordState.filters.screening_statuses||[],currentStatus);$('record-status').value=currentStatus;
        $('record-project').innerHTML='<option value="">全部方向</option>'+selectOptions(recordState.filters.projects||[],currentProject);$('record-project').value=currentProject;
        renderRecords();
      }catch(error){if(error.status!==401)toast(`邮件记录加载失败：${error.message}`);}
    }
    function renderRecords(){
      const statuses=recordState.filters?.screening_statuses||[];const results=recordState.filters?.interview_results||[];
      $('record-count').textContent=`${recordState.total} 条`;
      $('record-rows').innerHTML=recordState.items.map(item=>{
        const candidate=item.mail_type==='candidate';const controls=candidate&&item.base_record_id;
        const status=controls?`<select class="workflow-select" onchange="updateRecord('${item.thread_key}',{screening_status:this.value})">${selectOptions(statuses,item.screening_status)}</select>`:`<span class="pill">${esc(item.mail_type==='other'?'其他':item.screening_status)}</span>`;
        const assigned=controls?`<label class="assigned"><input type="checkbox" ${item.interview_assigned?'checked':''} onchange="updateRecord('${item.thread_key}',{interview_assigned:this.checked})"/>已分配</label>`:'—';
        const interview=controls?`<select class="workflow-select" onchange="updateRecord('${item.thread_key}',{interview_result:this.value})">${selectOptions(results,item.interview_result)}</select>`:'—';
        const projects=(item.projects||[]).map(value=>`<span class="tag">${esc(value)}</span>`).join('')||'—';
        const document=item.doc_url?`<a class="button" href="${esc(item.doc_url)}" target="_blank" rel="noopener" title="打开材料文档">↗</a>`:'';
        return `<tr data-thread="${item.thread_key}"><td class="when">${esc(fmt(item.latest_time))}<span class="cell-note">${item.has_replied?'已回复':'未回复'}</span></td><td class="person"><button class="person-button" onclick="openRecord('${item.thread_key}')">${esc(item.name)}</button><span class="person-meta">${esc(item.candidate_address)}</span></td><td class="study">${esc(item.study)}<span class="cell-note">${esc(item.academic_display)} · ${esc(item.rank)}</span></td><td><div class="tags">${projects}</div></td><td class="summary">${esc(item.purpose_summary||item.subject||'—')}</td><td class="workflow">${status}</td><td>${assigned}</td><td class="workflow">${interview}</td><td><div class="row-actions">${document}<button onclick="openRecord('${item.thread_key}')" title="查看详情">···</button></div></td></tr>`;
      }).join('')||'<tr><td colspan="9" class="empty">当前筛选下没有邮件</td></tr>';
      const start=recordState.total?recordState.offset+1:0;const end=Math.min(recordState.offset+recordState.limit,recordState.total);$('record-page').textContent=`${start}–${end} / ${recordState.total}`;$('record-prev').disabled=recordState.offset<=0;$('record-next').disabled=recordState.offset+recordState.limit>=recordState.total;
    }
    function queueRecordLoad(){clearTimeout(recordState.timer);recordState.timer=setTimeout(()=>{recordState.offset=0;loadRecords();},280);}
    function resetAndLoadRecords(){recordState.offset=0;loadRecords();}
    function changeRecordPage(direction){const next=Math.max(0,recordState.offset+direction*recordState.limit);if(next===recordState.offset)return;recordState.offset=next;loadRecords();document.getElementById('record-rows').scrollIntoView({behavior:'smooth',block:'start'});}
    async function updateRecord(threadKey,changes){
      const item=recordState.items.find(row=>row.thread_key===threadKey);if(!item)return;document.querySelectorAll(`tr[data-thread="${threadKey}"] select,tr[data-thread="${threadKey}"] input`).forEach(control=>control.disabled=true);
      try{await api('api/admin/mail/record',{method:'POST',body:JSON.stringify({thread_key:threadKey,changes,expected_updated_at:item.updated_at})});toast('已同步网页和飞书 Base');await Promise.all([loadStatus(false),loadRecords()]);}catch(error){toast(error.message);await loadRecords();}
    }
    function openRecord(threadKey){
      const item=recordState.items.find(row=>row.thread_key===threadKey);if(!item)return;$('detail-title').textContent=item.name;$('detail-subtitle').textContent=`${item.candidate_address} · ${fmt(item.latest_time)}`;
      const values=[['邮件类型',item.mail_type==='candidate'?'候选人来信':'其他邮件'],['主题',item.subject],['院校 / 就读',item.study],['专业',item.major],['学业表现',item.academic_display],['排名',`${item.rank}\n${item.rank_evidence}`],['申请方向',(item.projects||[]).join('、')||'—'],['摘要',item.purpose_summary||'—'],['来源邮箱',(item.source_accounts||[]).join('、')||'—'],['筛选状态',item.screening_status],['面试',`${item.interview_assigned?'已分配':'未分配'} · ${item.interview_result}`],['处理错误',item.last_error||'无']];
      $('detail-grid').innerHTML=values.map(([label,value])=>`<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join('');$('record-dialog').showModal();
    }
    async function refreshAll(announce=false){await loadStatus(false);if(!$('dashboard').classList.contains('hidden'))await loadRecords();if(announce)toast('已刷新 5090 邮件与候选状态');}
    async function scanMailbox(account){try{const result=await api('api/admin/mail/scan',{method:'POST',body:JSON.stringify({account})});toast(`已启动 ${result.account==='all'?'全部邮箱':result.account} 扫描`);await loadStatus();}catch(error){toast(error.message);}}
    async function saveConfig(){const button=$('save-config');button.disabled=true;try{await api('api/admin/mail/config',{method:'POST',body:JSON.stringify({scan_interval_minutes:Number($('scan-interval').value),report_interval_hours:Number($('report-interval').value)})});toast('配置已保存');await loadStatus();}catch(error){toast(error.message);}finally{button.disabled=false;}}
    refreshAll();setInterval(()=>loadStatus(false),15000);setInterval(loadRecords,60000);
  </script>
</body>
</html>
