<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MaxRead 邮件机器人</title>
  <style>
    :root { --bg:#f5f7f4; --paper:#fff; --text:#202621; --muted:#6f7871; --line:#dce2dd; --line-soft:#edf0ed; --green:#1f755d; --green-soft:#e8f2ee; --orange:#b86c24; --orange-soft:#f8eee3; --red:#b44037; --red-soft:#faecea; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    button,input,select { font:inherit; letter-spacing:0; }
    button,summary { cursor:pointer; }
    .wrap { width:min(1280px,calc(100% - 28px)); margin:0 auto; padding:18px 0 32px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 2px 14px; border-bottom:1px solid var(--line); }
    h1,h2 { margin:0; letter-spacing:0; }
    h1 { font-size:22px; }
    h2 { font-size:16px; }
    .sub,.muted { color:var(--muted); }
    .actions,.inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    a.button,button { min-height:34px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 11px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; text-decoration:none; }
    button.primary { color:#fff; background:var(--green); border-color:var(--green); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin:12px 0 10px; padding:9px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:7px; }
    .status.degraded { border-left-color:var(--orange); }
    .status.down { border-left-color:var(--red); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
    .degraded .dot { background:var(--orange); }
    .down .dot { background:var(--red); }
    .overview-bar { min-height:72px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px; padding:10px 12px; background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    #overview-metrics { grid-template-columns:repeat(4,minmax(100px,1fr)); }
    .metric { padding-left:10px; border-left:2px solid var(--line); }
    .metric strong { display:block; margin-top:1px; font-size:18px; font-variant-numeric:tabular-nums; }
    .tabs { display:flex; gap:18px; margin-top:14px; border-bottom:1px solid var(--line); }
    .tabs button { min-height:38px; padding:0 2px; color:var(--muted); background:transparent; border:0; border-bottom:2px solid transparent; border-radius:0; }
    .tabs button.active { color:var(--text); border-bottom-color:var(--green); font-weight:650; }
    .tabs .star { color:var(--orange); }
    .tab-count { min-width:18px; padding:1px 5px; color:var(--muted); background:#eef1ee; border-radius:9px; font-size:10px; font-variant-numeric:tabular-nums; }
    .tabs button.active .tab-count { color:var(--green); background:var(--green-soft); }
    .workspace { margin-top:10px; background:var(--paper); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .workspace-head { min-height:46px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line); }
    .record-toolbar { display:grid; grid-template-columns:minmax(190px,1.35fr) repeat(6,minmax(100px,.65fr)); gap:7px; padding:9px 12px; background:#fafbf9; border-bottom:1px solid var(--line); }
    .record-toolbar input,.record-toolbar select,.workflow-select { width:100%; height:34px; padding:0 8px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:6px; }
    .interest-group-bar { min-height:46px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 12px; background:#fafbf9; border-bottom:1px solid var(--line); }
    .group-tabs { min-width:0; display:flex; align-items:center; gap:5px; overflow:auto; scrollbar-width:thin; }
    .group-tab { flex:0 0 auto; min-height:30px; padding:0 9px; color:var(--muted); background:var(--paper); border-color:var(--line); }
    .group-tab.active { color:var(--green); background:var(--green-soft); border-color:#c9ddd4; font-weight:650; }
    .group-tab .count { margin-left:3px; font-size:10px; font-variant-numeric:tabular-nums; }
    .group-select { width:112px; height:32px; padding:0 6px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:6px; font-size:12px; }
    .bulk-group { display:flex; align-items:center; gap:5px; }
    .bulk-group select { width:120px; height:32px; padding:0 6px; border:1px solid #bfd8cd; border-radius:6px; }
    .selection-bar { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 12px; color:#315f50; background:var(--green-soft); border-bottom:1px solid #cfe1d9; }
    .record-table-wrap { min-height:300px; max-height:calc(100dvh - 296px); overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
    th { color:var(--muted); background:var(--paper); font-size:12px; font-weight:600; }
    .record-table { min-width:900px; }
    .record-table th { position:sticky; top:0; z-index:1; }
    .record-table td { vertical-align:middle; white-space:normal; }
    .record-table .person { width:205px; }
    .record-table .study { width:245px; }
    .record-table .direction { width:165px; }
    .record-table .reply { width:92px; }
    .person-layout { display:grid; grid-template-columns:18px minmax(0,1fr); align-items:start; gap:9px; }
    .candidate-check { width:15px; height:15px; margin:3px 0 0; accent-color:var(--green); cursor:pointer; }
    .head-check { display:inline-flex; align-items:center; gap:8px; }
    .head-check input { width:14px; height:14px; accent-color:var(--green); }
    .person-button { padding:0; min-height:0; justify-content:flex-start; color:var(--green); background:transparent; border:0; font-weight:680; text-align:left; }
    .person-meta,.cell-note { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .tags { display:flex; flex-wrap:wrap; gap:4px; }
    .tag { display:inline-flex; padding:2px 6px; color:#315f50; background:var(--green-soft); border-radius:4px; font-size:11px; }
    .assigned { display:inline-flex; align-items:center; gap:5px; min-height:30px; margin-right:6px; white-space:nowrap; }
    .assigned input { width:15px; height:15px; accent-color:var(--green); }
    .row-actions { display:flex; justify-content:flex-end; gap:5px; }
    .row-actions a,.row-actions button { width:32px; min-height:32px; padding:0; }
    .star-button { width:32px; min-height:32px; padding:0; color:var(--muted); font-size:19px; line-height:1; }
    .star-button.active { color:var(--orange); background:var(--orange-soft); border-color:#e3c7a8; }
    .pager { min-height:46px; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:6px 12px; }
    .pager span { color:var(--muted); font-size:12px; }
    .page-jump { display:inline-flex; align-items:center; gap:5px; color:var(--muted); white-space:nowrap; }
    .pager .page-jump input { width:58px; height:34px; padding:0 6px; text-align:center; }
    .pill { display:inline-flex; align-items:center; min-height:23px; padding:0 8px; border-radius:12px; color:var(--green); background:var(--green-soft); }
    .pill.bad { color:var(--red); background:var(--red-soft); }
    .pill.warn { color:var(--orange); background:var(--orange-soft); }
    .ops-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
    .card { min-width:0; padding:14px; background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .wide { grid-column:1/-1; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .account-list { display:grid; gap:6px; }
    .account { display:grid; grid-template-columns:minmax(210px,1.4fr) 70px minmax(140px,.8fr) minmax(140px,.8fr) auto; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line-soft); }
    .account:first-child { border-top:0; }
    .address { overflow-wrap:anywhere; font-weight:650; }
    label.field { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    input[type=number] { width:100%; height:36px; padding:0 9px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .config { display:grid; grid-template-columns:1fr 1fr auto; align-items:end; gap:10px; }
    .ops-details { background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .ops-details summary { min-height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-weight:650; }
    .ops-details[open] summary { border-bottom:1px solid var(--line); }
    .table-wrap { max-height:340px; overflow:auto; }
    .error-list { padding:0 14px 10px; }
    .error-row { display:grid; grid-template-columns:56px minmax(0,1fr) 150px; gap:12px; padding:9px 0; border-top:1px solid var(--line-soft); }
    dialog { width:min(500px,calc(100vw - 20px)); height:100dvh; max-height:none; margin:0 0 0 auto; padding:0; color:var(--text); background:var(--paper); border:0; border-left:1px solid var(--line); border-radius:0; box-shadow:-20px 0 60px rgba(26,31,27,.2); }
    dialog::backdrop { background:rgba(30,36,32,.28); }
    dialog.share-dialog { width:min(560px,calc(100vw - 24px)); height:min(520px,calc(100dvh - 24px)); max-height:calc(100dvh - 24px); margin:auto; border:1px solid var(--line); border-radius:8px; box-shadow:0 22px 70px rgba(26,31,27,.22); }
    dialog.group-dialog { width:min(420px,calc(100vw - 24px)); height:min(240px,calc(100dvh - 24px)); }
    .group-dialog .share-fields { grid-template-columns:1fr; }
    .share-form { display:grid; gap:13px; max-height:calc(100dvh - 26px); padding:18px; overflow:auto; }
    .share-form-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .share-fields { display:grid; grid-template-columns:minmax(0,1fr) 150px; gap:10px; }
    .share-fields label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    .share-fields input,.share-fields select,.share-link input { width:100%; height:38px; padding:0 9px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .share-link { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; }
    .share-result { display:grid; gap:8px; padding:11px; background:var(--green-soft); border:1px solid #cfe1d9; border-radius:7px; }
    .share-history { max-height:240px; overflow:auto; border-top:1px solid var(--line); }
    .share-history-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
    .share-history-row strong,.share-history-row span { display:block; }
    .share-history-row button { min-height:30px; }
    .share-history-actions { display:flex; align-items:center; justify-content:flex-end; gap:5px; flex-wrap:wrap; }
    .share-history-actions a { min-height:30px; }
    .share-status { color:var(--green); }
    .share-status.expired,.share-status.revoked { color:var(--muted); }
    .detail { height:100%; padding:18px; overflow:auto; }
    .detail-head { position:sticky; top:-18px; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin:-18px -18px 0; padding:18px; background:var(--paper); border-bottom:1px solid var(--line); }
    .detail-head button { min-height:32px; padding:0 9px; }
    .detail-grid { display:grid; grid-template-columns:120px minmax(0,1fr); gap:0; margin-top:6px; }
    .detail-grid dt,.detail-grid dd { margin:0; padding:9px 3px; border-bottom:1px solid var(--line-soft); }
    .detail-grid dt { color:var(--muted); }
    .detail-grid dd { white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { padding:24px; color:var(--muted); text-align:center; }
    .auth { width:min(460px,100%); margin:72px auto 0; padding:24px; background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .auth form { display:grid; grid-template-columns:1fr; gap:8px; margin-top:16px; }
    .auth form button { justify-self:end; }
    .auth input { min-width:0; height:38px; padding:0 10px; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .form-error { min-height:20px; margin:8px 0 0; color:var(--red); }
    .hidden { display:none !important; }
    .toast { position:fixed; z-index:20; right:20px; bottom:20px; padding:10px 13px; color:#fff; background:#202621; border-radius:7px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:none; }
    @media (max-width:760px) { .wrap{width:calc(100% - 16px);padding-top:10px;} header{align-items:flex-start;flex-direction:column;} .status{align-items:flex-start;flex-direction:column;} .overview-bar{grid-template-columns:1fr;} #overview-metrics{grid-template-columns:1fr 1fr;} .workspace-head{align-items:flex-start;flex-direction:column;} .interest-group-bar{align-items:flex-start;flex-direction:column;} .group-tabs{width:100%;} .selection-bar{align-items:flex-start;flex-direction:column;} .record-toolbar{grid-template-columns:1fr 1fr;} .record-toolbar input{grid-column:1/-1;} .record-table-wrap{max-height:55dvh;} .record-table{display:block;min-width:0;} .record-table thead{display:none;} .record-table tbody{display:block;} .record-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px;border-bottom:1px solid var(--line);} .record-table td{display:block;padding:0;border:0;width:auto!important;min-width:0;} .record-table td:nth-child(2){grid-column:1/-1;} .record-table td:last-child{grid-column:1/-1;} .row-actions{flex-wrap:wrap;} .group-select{width:126px;} .pager{justify-content:center;flex-wrap:wrap;} .ops-grid{grid-template-columns:1fr;} .wide{grid-column:auto;} .account{grid-template-columns:1fr 1fr;} .account .address{grid-column:1/-1;} .account div:nth-child(4){display:none;} .config{grid-template-columns:1fr;} dialog{width:100vw;} dialog.share-dialog{width:calc(100vw - 16px);} .share-fields{grid-template-columns:1fr;} .detail-grid{grid-template-columns:96px minmax(0,1fr);} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>邮件机器人</h1><div class="sub" id="execution-host">MaxRead Recruiting Mail</div></div>
      <div class="actions"><a class="button" href="admin">返回控制台</a><button id="logout" class="hidden" onclick="logoutMailAdmin()">退出管理员</button><button onclick="refreshAll(true)">刷新</button></div>
    </header>
    <section id="auth" class="auth hidden">
      <h2>管理员登录</h2>
      <p class="muted">用于邮箱扫描、调度和候选数据维护。本设备登录状态保持 30 天，密码不会保存在页面中。</p>
      <form onsubmit="loginMailAdmin(event)"><input id="admin-username" type="email" autocomplete="username" placeholder="管理员账号" aria-label="管理员账号" required /><input id="admin-password" type="password" autocomplete="current-password" placeholder="管理员密码" aria-label="管理员密码" required /><button class="primary" type="submit">登录</button></form>
      <p id="admin-login-error" class="form-error" role="alert"></p>
    </section>
    <main id="dashboard" class="hidden">
      <section id="status" class="status"><div class="inline"><span class="dot"></span><strong id="status-label">读取中</strong></div><span class="muted" id="status-detail"></span></section>
      <section class="overview-bar">
        <div class="metric-grid" id="overview-metrics"></div>
        <span class="muted" id="overview-updated"></span>
      </section>
      <nav class="tabs" aria-label="邮件管理视图"><button class="active" data-view="candidates" onclick="setMailView('candidates')">候选人</button><button data-view="interest" onclick="setMailView('interest')"><span class="star">★</span> 重点关注 <span class="tab-count" id="tab-interest-count">0</span></button><button data-view="operations" onclick="setMailView('operations')">运维</button></nav>
      <section id="candidate-panel" class="workspace">
          <div class="workspace-head"><div><h2 id="workspace-title">候选人与邮件</h2><div class="muted" id="workspace-subtitle">候选人资料与来信状态</div></div><span class="muted" id="record-count"></span></div>
          <div id="interest-group-bar" class="interest-group-bar hidden"><div class="group-tabs" id="interest-group-tabs"></div><div class="inline"><button type="button" onclick="openInterestGroupDialog()" title="新建分组">＋ 新建分组</button><button id="manage-interest-group" class="hidden" type="button" onclick="openInterestGroupDialog(recordState.interestGroup)" title="管理当前分组">···</button></div></div>
          <div class="record-toolbar">
            <input id="record-search" type="search" placeholder="搜索姓名、学校、邮箱、方向" oninput="queueRecordLoad()" />
            <select id="record-account" onchange="resetAndLoadRecords()"><option value="">全部邮箱</option><option value="zip-lab">ZIP Lab</option><option value="bohan">Bohan</option></select>
            <select id="record-reply" onchange="resetAndLoadRecords()"><option value="">回复状态</option><option value="replied">已回复</option><option value="unreplied">未回复</option></select>
            <select id="record-project" onchange="resetAndLoadRecords()"><option value="">全部方向</option></select>
            <select id="record-tier" onchange="resetAndLoadRecords()"><option value="">全部院校</option><option value="c9">C9</option><option value="985">985</option></select>
            <select id="record-rank" onchange="resetAndLoadRecords()"><option value="0">全部排名</option><option value="5">Top 5%</option><option value="10">Top 10%</option><option value="20">Top 20%</option><option value="30">Top 30%</option></select>
            <select id="record-days" onchange="resetAndLoadRecords()"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option><option value="0">全部时间</option></select>
          </div>
          <div id="selection-bar" class="selection-bar hidden"><span>已选择 <strong id="selected-count">0</strong> 位候选人</span><div class="inline"><div id="bulk-group" class="bulk-group hidden"><select id="bulk-interest-group" aria-label="批量移动到分组"></select><button onclick="assignSelectedInterestGroup()">移动</button></div><button class="primary" onclick="openShareDialog()">生成分享链接</button><button onclick="clearCandidateSelection()">清除选择</button></div></div>
          <div class="record-table-wrap"><table class="record-table"><thead><tr><th><label class="head-check"><input id="select-page" type="checkbox" onchange="toggleCurrentPage(this.checked)" aria-label="选择本页候选人" />候选人 / 来信</label></th><th>院校 / 学业</th><th>方向</th><th>回复</th><th></th></tr></thead><tbody id="record-rows"></tbody></table></div>
          <div class="pager"><button id="record-prev" onclick="changeRecordPage(-1)">上一页</button><span id="record-page"></span><label class="page-jump">跳到第 <input id="record-page-input" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码" onkeydown="if(event.key==='Enter'){event.preventDefault();jumpRecordPage();}" /> 页</label><button id="record-jump" onclick="jumpRecordPage()">跳转</button><button id="record-next" onclick="changeRecordPage(1)">下一页</button></div>
      </section>
      <section id="operations-panel" class="hidden">
        <div class="ops-grid">
        <section class="card wide">
          <div class="card-head"><div><h2>邮箱</h2><div class="muted" id="control-state"></div></div><button class="primary" id="scan-all" onclick="scanMailbox('all')">扫描全部</button></div>
          <div class="account-list" id="accounts"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>自动任务</h2><span class="pill" id="service-pill">未知</span></div>
          <div class="metric-grid" id="service-metrics"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>候选处理</h2><span class="pill" id="run-pill">未知</span></div>
          <div class="metric-grid" id="run-metrics"></div>
        </section>
        <section class="card wide">
          <div class="card-head"><h2>调度配置</h2><span class="muted">保存后重启对应 systemd 单元</span></div>
          <div class="config">
            <label class="field">自动扫描/候选发布间隔（分钟）<input id="scan-interval" type="number" min="5" max="10080" step="5" /></label>
            <label class="field">周报发布间隔（小时）<input id="report-interval" type="number" min="1" max="720" step="1" /></label>
            <button class="primary" id="save-config" onclick="saveConfig()">保存配置</button>
          </div>
        </section>
        <details class="ops-details wide">
          <summary><span>最近运行</span><span class="muted" id="run-count"></span></summary>
          <div class="table-wrap"><table><thead><tr><th>开始</th><th>状态</th><th>邮件</th><th>新增</th><th>更新</th><th>失败</th><th>耗时</th></tr></thead><tbody id="runs"></tbody></table></div>
        </details>
        <details class="ops-details wide">
          <summary><span>近期错误</span><span class="muted">按相同错误聚合</span></summary>
          <div class="error-list" id="errors"></div>
        </details>
        </div>
      </section>
    </main>
  </div>
  <dialog id="record-dialog"><div class="detail"><div class="detail-head"><div><h2 id="detail-title"></h2><div class="muted" id="detail-subtitle"></div></div><button onclick="document.getElementById('record-dialog').close()" aria-label="关闭详情">关闭</button></div><dl class="detail-grid" id="detail-grid"></dl></div></dialog>
  <dialog id="share-dialog" class="share-dialog">
    <form class="share-form" onsubmit="createCandidateShare(event)">
      <div class="share-form-head"><div><h2>分享候选人</h2><div class="muted" id="share-selection-note"></div></div><button type="button" onclick="document.getElementById('share-dialog').close()" aria-label="关闭">关闭</button></div>
      <div class="share-fields"><label>分享标题<input id="share-title" maxlength="80" required /></label><label>有效期<select id="share-expiry"><option value="1">1 天</option><option value="7" selected>7 天</option><option value="30">30 天</option><option value="0">长期有效</option></select></label></div>
      <div class="inline"><button id="share-create" class="primary" type="submit">生成分享链接</button><button type="button" onclick="clearCandidateSelection()">清除选择</button></div>
      <div id="share-result" class="share-result hidden"><strong>分享链接已生成</strong><div class="share-link"><input id="share-link" readonly aria-label="候选人分享链接" /><button type="button" onclick="copyShareLink()">复制</button></div><div class="muted" id="share-result-meta"></div></div>
      <div><strong>最近分享</strong><div id="share-history" class="share-history"><div class="empty">暂无分享记录</div></div></div>
    </form>
  </dialog>
  <dialog id="interest-group-dialog" class="share-dialog group-dialog">
    <form class="share-form" onsubmit="saveInterestGroup(event)">
      <div class="share-form-head"><div><h2 id="interest-group-dialog-title">新建分组</h2><div class="muted">仅整理重点关注，不同步飞书</div></div><button type="button" onclick="document.getElementById('interest-group-dialog').close()" aria-label="关闭">关闭</button></div>
      <input id="interest-group-id" type="hidden" value="0" />
      <div class="share-fields"><label>分组名称<input id="interest-group-name" maxlength="30" required /></label></div>
      <div class="inline"><button class="primary" type="submit">保存</button><button id="delete-interest-group" class="hidden" type="button" onclick="deleteInterestGroup()">删除分组</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = value => value ? new Intl.DateTimeFormat('zh-CN',{dateStyle:'short',timeStyle:'medium'}).format(new Date(value)) : '—';
    const duration = (start,end) => { if(!start||!end)return '—'; const s=Math.max(0,(new Date(end)-new Date(start))/1000); return s<60?`${Math.round(s)} 秒`:`${Math.round(s/60)} 分钟`; };
    async function api(path,options={}) { const response=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},...options}); const body=await response.json().catch(()=>({})); if(!response.ok){const e=new Error(body.error||`HTTP ${response.status}`);e.status=response.status;throw e;} return body; }
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200);}
    function metric(label,value){return `<div class="metric"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong></div>`;}
    function pill(status,bad=false,warn=false){return `<span class="pill ${bad?'bad':warn?'warn':''}">${esc(status)}</span>`;}
    const recordState={items:[],view:'all',offset:0,limit:20,total:0,timer:null,filters:null,selected:new Map(),activeShare:null,interestGroup:'all',interestGroups:[],interestUngrouped:0,filterSets:{all:{q:'',account:'',reply:'',project:'',tier:'',rank:'0',days:'30'},interest:{q:'',account:'',reply:'',project:'',tier:'',rank:'0',days:'0'}}};
    const selectOptions=(values,current)=>values.map(value=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(value)}</option>`).join('');
    function readRecordFilters(){return {q:$('record-search').value.trim(),account:$('record-account').value,reply:$('record-reply').value,project:$('record-project').value,tier:$('record-tier').value,rank:$('record-rank').value,days:$('record-days').value};}
    function saveRecordFilters(){recordState.filterSets[recordState.view]=readRecordFilters();}
    function applyRecordFilters(view){const values=recordState.filterSets[view];$('record-search').value=values.q;$('record-account').value=values.account;$('record-reply').value=values.reply;$('record-project').value=values.project;$('record-tier').value=values.tier;$('record-rank').value=values.rank;$('record-days').value=values.days;}
    async function loadStatus(announce=false){
      try{
        const data=await api('api/admin/mail/status');
        $('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');render(data);if(announce)toast('已刷新 5090 实时状态');
      }catch(error){
        $('dashboard').classList.add('hidden');$('auth').classList.remove('hidden');$('logout').classList.add('hidden');
        if(error.status===401)return;
        $('auth').querySelector('p').textContent=`状态加载失败：${error.message}`;
        toast(error.message);
      }
    }
    function render(data){
      $('execution-host').textContent=data.remote_execution&&data.execution_host?`MaxRead Recruiting Mail · 执行节点 ${data.execution_host}`:'MaxRead Recruiting Mail';
      const latest=data.runs?.[0]||{}; const state=data.business_state||'down';
      const active=Boolean(data.control?.active);
      $('status').className=`status ${state}`;$('status-label').textContent=state==='healthy'?'运行正常':state==='scanning'?'手动扫描中':state==='degraded'?'进程正常，业务降级':'服务异常';
      const changed=Number(latest.new_threads||0)+Number(latest.updated_threads||0); const latestFailed=Number(latest.failed_threads||0);
      const syncPending=Number(data.admin_sync?.pending||0);const syncNote=syncPending?` · ${syncPending} 项等待飞书同步`:'';
      $('status-detail').textContent=(active?`正在扫描${data.control.account==='all'?'全部邮箱':data.control.account||''}，结束后自动恢复常驻任务`:latest.started_at?`最近运行 ${fmt(latest.started_at)}${latestFailed?` · ${latestFailed}/${changed||latestFailed} 失败`:''}`:'暂无运行记录')+syncNote;
      const overview=data.overview||{};const metrics=overview.metrics||{};
      $('overview-updated').textContent=overview.updated_at?`更新至 ${overview.updated_at}`:'';
      $('overview-metrics').innerHTML=metric('候选人',metrics.candidate_total||0)+metric('未筛选',metrics.unscreened||0)+metric('最近一周新增',metrics.recent_candidates||0)+metric('其他邮件',metrics.other_total||0);
      $('control-state').textContent=active?`后台任务：${data.control.account==='all'?'全部邮箱':data.control.account||'手动扫描'}`:'当前没有手动扫描';$('scan-all').disabled=active;
      $('accounts').innerHTML=(data.accounts||[]).map(a=>`<div class="account"><div><div class="address">${esc(a.address)}</div><div class="muted">${esc(a.id)}</div></div><div><span class="muted">邮件</span><br><strong>${Number(a.messages||0)}</strong></div><div><span class="muted">最近扫描</span><br>${esc(fmt(a.last_scan))}</div><div><span class="muted">最新来信</span><br>${esc(fmt(a.latest_mail))}</div><button ${active?'disabled':''} onclick="scanMailbox('${esc(a.id)}')">立即扫描</button></div>`).join('')||'<div class="empty">未发现邮箱配置</div>';
      const serviceActive=data.service?.ActiveState==='active';const serviceLabel=active?'手动扫描接管':serviceActive?'active':data.service?.ActiveState||'unknown';$('service-pill').outerHTML=pill(serviceLabel,!serviceActive&&!active,active).replace('<span','<span id="service-pill"');
      $('service-metrics').innerHTML=metric('PID',data.service?.MainPID||'—')+metric('重启次数',data.service?.NRestarts||0)+metric('周报下次',fmt(data.report_timer?.NextElapseUSecRealtimeISO));
      const failed=Number(latest.failed_threads||0); const runLabel=latest.status==='completed'&&failed?'部分失败':latest.status||'暂无';$('run-pill').outerHTML=pill(runLabel,latest.status==='failed',failed>0).replace('<span','<span id="run-pill"');
      $('run-metrics').innerHTML=metric('邮件会话',data.thread_stats?.active||0)+metric('提取失败待重试',data.thread_stats?.extract_failed||0)+metric('本轮失败',failed);
      $('scan-interval').value=data.config?.scan_interval_minutes||1440;$('report-interval').value=data.config?.report_interval_hours||168;
      $('run-count').textContent=`${(data.runs||[]).length} 条`;
      $('runs').innerHTML=(data.runs||[]).map(r=>`<tr><td>${esc(fmt(r.started_at))}</td><td>${pill(r.status,r.status==='failed'||r.status==='abandoned',Number(r.failed_threads)>0)}</td><td>${Number(r.scanned_messages||0)}</td><td>${Number(r.new_threads||0)}</td><td>${Number(r.updated_threads||0)}</td><td>${Number(r.failed_threads||0)}</td><td>${esc(duration(r.started_at,r.finished_at))}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无运行</td></tr>';
      $('errors').innerHTML=(data.errors||[]).map(e=>`<div class="error-row"><strong>${Number(e.count||0)}</strong><span>${esc(e.error||'未知错误')}</span><span class="time muted">${esc(fmt(e.last_seen))}</span></div>`).join('')||'<div class="empty">没有近期错误</div>';
    }
    async function loadRecords(){
      saveRecordFilters();const values=recordState.filterSets[recordState.view];
      const params=new URLSearchParams({q:values.q,mail_type:'candidate',interest:recordState.view==='interest'?'only':'',interest_group:recordState.view==='interest'?recordState.interestGroup:'all',account:values.account,reply:values.reply,project:values.project,tier:values.tier,rank_percentile:values.rank,days:values.days,offset:String(recordState.offset),limit:String(recordState.limit)});
      try{
        const data=await api(`api/admin/mail/records?${params}`);recordState.items=data.items||[];recordState.items.forEach(item=>{if(recordState.selected.has(item.thread_key))recordState.selected.set(item.thread_key,item);});recordState.total=Number(data.total||0);recordState.filters=data.filters||recordState.filters||{};recordState.interestGroups=data.interest_groups||[];recordState.interestUngrouped=Number(data.interest_ungrouped||0);$('tab-interest-count').textContent=String(Number(data.interest_total||0));
        const currentProject=values.project;
        $('record-project').innerHTML='<option value="">全部方向</option>'+selectOptions(recordState.filters.projects||[],currentProject);$('record-project').value=currentProject;recordState.filterSets[recordState.view].project=$('record-project').value;
        renderInterestGroups();renderRecords();
      }catch(error){if(error.status!==401)toast(`邮件记录加载失败：${error.message}`);}
    }
    function interestGroupOptions(current){return `<option value="0" ${!current?'selected':''}>未分组</option>`+recordState.interestGroups.map(group=>`<option value="${Number(group.id)}" ${Number(current)===Number(group.id)?'selected':''}>${esc(group.name)}</option>`).join('');}
    function renderInterestGroups(){if(recordState.view!=='interest')return;const tabs=[`<button class="group-tab ${recordState.interestGroup==='all'?'active':''}" onclick="selectInterestGroup('all')">全部 <span class="count">${esc($('tab-interest-count').textContent)}</span></button>`,`<button class="group-tab ${recordState.interestGroup==='ungrouped'?'active':''}" onclick="selectInterestGroup('ungrouped')">未分组 <span class="count">${recordState.interestUngrouped}</span></button>`,...recordState.interestGroups.map(group=>`<button class="group-tab ${String(group.id)===recordState.interestGroup?'active':''}" onclick="selectInterestGroup('${Number(group.id)}')">${esc(group.name)} <span class="count">${Number(group.count||0)}</span></button>`)];$('interest-group-tabs').innerHTML=tabs.join('');$('manage-interest-group').classList.toggle('hidden',!/^[1-9]\d*$/.test(recordState.interestGroup));$('bulk-interest-group').innerHTML=interestGroupOptions(0);}
    function renderRecords(){
      $('record-count').textContent=`${recordState.total} 条`;
      $('record-rows').innerHTML=recordState.items.map(item=>{
        const projects=(item.projects||[]).map(value=>`<span class="tag">${esc(value)}</span>`).join('')||'—';
        const document=item.doc_url?`<a class="button" href="${esc(item.doc_url)}" target="_blank" rel="noopener" title="打开材料文档">↗</a>`:'';
        const reply=pill(item.has_replied?'已回复':'未回复',false,!item.has_replied);
        const star=`<button class="star-button ${item.is_interested?'active':''}" aria-pressed="${item.is_interested?'true':'false'}" onclick="toggleInterested(event,'${item.thread_key}')" title="${item.is_interested?'取消重点关注':'标记为重点候选人'}">${item.is_interested?'★':'☆'}</button>`;
        const groupControl=recordState.view==='interest'?`<select class="group-select" aria-label="${esc(item.name)}的分组" onchange="assignInterestGroup(event,'${item.thread_key}')">${interestGroupOptions(item.interest_group_id)}</select>`:'';
        const checked=recordState.selected.has(item.thread_key)?'checked':'';
        return `<tr data-thread="${item.thread_key}"><td class="person"><div class="person-layout"><input class="candidate-check" type="checkbox" ${checked} onchange="toggleCandidateSelection(event,'${item.thread_key}')" aria-label="选择 ${esc(item.name)}" /><div><button class="person-button" onclick="openRecord('${item.thread_key}')">${esc(item.name)}</button><span class="person-meta">${esc(item.candidate_address)}</span><span class="cell-note">${esc(fmt(item.latest_time))}</span></div></div></td><td class="study">${esc(item.study)}<span class="cell-note">${esc(item.academic_display)} · ${esc(item.rank)}</span></td><td class="direction"><div class="tags">${projects}</div></td><td class="reply">${reply}</td><td><div class="row-actions">${groupControl}${star}${document}<button onclick="openRecord('${item.thread_key}')" title="查看详情">···</button></div></td></tr>`;
      }).join('')||`<tr><td colspan="5" class="empty">${recordState.view==='interest'?'还没有符合当前筛选的重点候选人':'当前筛选下没有邮件'}</td></tr>`;
      const start=recordState.total?recordState.offset+1:0;const end=Math.min(recordState.offset+recordState.limit,recordState.total);const pageCount=Math.max(1,Math.ceil(recordState.total/recordState.limit));const currentPage=Math.min(pageCount,Math.floor(recordState.offset/recordState.limit)+1);$('record-page').textContent=`${start}–${end} / ${recordState.total}`;$('record-page-input').max=String(pageCount);$('record-page-input').value=String(currentPage);$('record-page-input').disabled=!recordState.total;$('record-jump').disabled=!recordState.total;$('record-prev').disabled=recordState.offset<=0;$('record-next').disabled=recordState.offset+recordState.limit>=recordState.total;
      updateCandidateSelection();
    }
    function toggleCandidateSelection(event,threadKey){event?.stopPropagation();const item=recordState.items.find(row=>row.thread_key===threadKey);if(!item)return;if(event.currentTarget.checked){if(recordState.selected.size>=50){event.currentTarget.checked=false;toast('一次最多分享 50 位候选人');return;}recordState.selected.set(threadKey,item);}else{recordState.selected.delete(threadKey);}updateCandidateSelection();}
    function toggleCurrentPage(checked){const pageItems=recordState.items||[];if(checked&&recordState.selected.size+pageItems.filter(item=>!recordState.selected.has(item.thread_key)).length>50){$('select-page').checked=false;toast('一次最多分享 50 位候选人');return;}pageItems.forEach(item=>checked?recordState.selected.set(item.thread_key,item):recordState.selected.delete(item.thread_key));renderRecords();}
    function updateCandidateSelection(){const count=recordState.selected.size;$('selected-count').textContent=String(count);$('selection-bar').classList.toggle('hidden',count===0);$('bulk-group').classList.toggle('hidden',count===0||recordState.view!=='interest');const pageItems=recordState.items||[];const selectedOnPage=pageItems.filter(item=>recordState.selected.has(item.thread_key)).length;$('select-page').checked=Boolean(pageItems.length)&&selectedOnPage===pageItems.length;$('select-page').indeterminate=selectedOnPage>0&&selectedOnPage<pageItems.length;}
    function clearCandidateSelection(){recordState.selected.clear();$('share-result').classList.add('hidden');renderRecords();if($('share-dialog').open)$('share-dialog').close();}
    async function toggleInterested(event,threadKey){
      event?.stopPropagation();const item=recordState.items.find(row=>row.thread_key===threadKey);if(!item)return;const button=event?.currentTarget;if(button)button.disabled=true;
      try{await api('api/admin/mail/record',{method:'POST',body:JSON.stringify({thread_key:threadKey,changes:{is_interested:!item.is_interested},expected_updated_at:item.updated_at})});toast(item.is_interested?'已移出重点候选人':'已加入重点候选人');await loadRecords();}catch(error){toast(error.message);}finally{if(button)button.disabled=false;}
    }
    function selectInterestGroup(group){recordState.interestGroup=String(group);recordState.offset=0;recordState.selected.clear();loadRecords();}
    async function assignInterestGroup(event,threadKey){event.stopPropagation();const select=event.currentTarget;select.disabled=true;try{await api('api/admin/mail/interest-groups',{method:'POST',body:JSON.stringify({action:'assign',group_id:Number(select.value),thread_keys:[threadKey]})});toast('已移动分组');await loadRecords();}catch(error){toast(error.message);await loadRecords();}finally{select.disabled=false;}}
    async function assignSelectedInterestGroup(){const keys=[...recordState.selected.keys()];if(!keys.length)return;const groupId=Number($('bulk-interest-group').value);try{await api('api/admin/mail/interest-groups',{method:'POST',body:JSON.stringify({action:'assign',group_id:groupId,thread_keys:keys})});recordState.selected.clear();toast(`已移动 ${keys.length} 位候选人`);await loadRecords();}catch(error){toast(error.message);}}
    function openInterestGroupDialog(groupId=0){const id=Number(groupId)||0;const group=recordState.interestGroups.find(item=>Number(item.id)===id);$('interest-group-id').value=String(id);$('interest-group-name').value=group?.name||'';$('interest-group-dialog-title').textContent=id?'编辑分组':'新建分组';$('delete-interest-group').classList.toggle('hidden',!id);$('interest-group-dialog').showModal();$('interest-group-name').focus();}
    async function saveInterestGroup(event){event.preventDefault();const id=Number($('interest-group-id').value)||0;try{const data=await api('api/admin/mail/interest-groups',{method:'POST',body:JSON.stringify({action:id?'rename':'create',group_id:id,name:$('interest-group-name').value.trim()})});$('interest-group-dialog').close();if(!id)recordState.interestGroup=String(data.group.id);toast(id?'分组已重命名':'分组已创建');await loadRecords();}catch(error){toast(error.message);}}
    async function deleteInterestGroup(){const id=Number($('interest-group-id').value)||0;if(!id||!confirm('删除后，组内候选人会回到“未分组”，星标不会取消。确定删除？'))return;try{await api('api/admin/mail/interest-groups',{method:'POST',body:JSON.stringify({action:'delete',group_id:id})});$('interest-group-dialog').close();recordState.interestGroup='ungrouped';toast('分组已删除，候选人已移到未分组');await loadRecords();}catch(error){toast(error.message);}}
    function queueRecordLoad(){clearTimeout(recordState.timer);recordState.timer=setTimeout(()=>{recordState.offset=0;loadRecords();},280);}
    function resetAndLoadRecords(){recordState.offset=0;loadRecords();}
    function changeRecordPage(direction){const next=Math.max(0,recordState.offset+direction*recordState.limit);if(next===recordState.offset)return;recordState.offset=next;loadRecords();document.querySelector('.record-table-wrap').scrollTo({top:0,behavior:'smooth'});}
    function jumpRecordPage(){const pageCount=Math.max(1,Math.ceil(recordState.total/recordState.limit));const requested=Number.parseInt($('record-page-input').value,10);if(!Number.isFinite(requested)){toast('请输入页码');return;}const page=Math.max(1,Math.min(pageCount,requested));$('record-page-input').value=String(page);const next=(page-1)*recordState.limit;if(next===recordState.offset)return;recordState.offset=next;loadRecords();document.querySelector('.record-table-wrap').scrollTo({top:0,behavior:'smooth'});}
    function setMailView(view){saveRecordFilters();const operations=view==='operations';$('candidate-panel').classList.toggle('hidden',operations);$('operations-panel').classList.toggle('hidden',!operations);document.querySelectorAll('.tabs button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(operations)return;const next=view==='interest'?'interest':'all';if(next!==recordState.view)recordState.selected.clear();recordState.view=next;recordState.offset=0;applyRecordFilters(recordState.view);$('interest-group-bar').classList.toggle('hidden',recordState.view!=='interest');$('workspace-title').textContent=recordState.view==='interest'?'重点关注':'候选人与邮件';$('workspace-subtitle').textContent=recordState.view==='interest'?'已收藏候选人':'候选人资料与来信状态';loadRecords();}
    function openRecord(threadKey){
      const item=recordState.items.find(row=>row.thread_key===threadKey);if(!item)return;$('detail-title').textContent=item.name;$('detail-subtitle').textContent=`${item.candidate_address} · ${fmt(item.latest_time)}`;
      const values=[['重点关注',item.is_interested?'是':'否'],['邮件类型',item.mail_type==='candidate'?'候选人来信':'其他邮件'],['筛选状态',item.screening_label||item.screening_status],['回复状态',item.has_replied?'已回复':'未回复'],['主题',item.subject],['院校 / 就读',item.study],['专业',item.major],['学业表现',item.academic_display],['排名',`${item.rank}\n${item.rank_evidence}`],['申请方向',(item.projects||[]).join('、')||'—'],['摘要',item.purpose_summary||'—'],['来源邮箱',(item.source_accounts||[]).join('、')||'—'],['处理错误',item.last_error||'无']];
      $('detail-grid').innerHTML=values.map(([label,value])=>`<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join('');$('record-dialog').showModal();
    }
    async function openShareDialog(){const count=recordState.selected.size;if(!count){toast('请先选择候选人');return;}const names=[...recordState.selected.values()].map(item=>item.name||'unknown');const title=names.length<=3?names.join('、'):`${names.slice(0,3).join('、')}等${names.length}人`;$('share-selection-note').textContent=`已选择 ${count} 位候选人，分享页包含邮箱、申请摘要和材料文档，请谨慎转发`;$('share-title').value=title;$('share-result').classList.add('hidden');$('share-dialog').showModal();await loadCandidateShares();}
    function shareUrl(token){const match=location.pathname.match(/^(.*)\/mail\/?$/);const prefix=match?.[1]||'';return `${location.origin}${prefix}/mail/share/${token}`;}
    async function createCandidateShare(event){event.preventDefault();const button=$('share-create');button.disabled=true;try{const data=await api('api/admin/mail/shares',{method:'POST',body:JSON.stringify({thread_keys:[...recordState.selected.keys()],title:$('share-title').value.trim(),expires_days:Number($('share-expiry').value)})});recordState.activeShare=data.share;const url=shareUrl(data.share.token);$('share-link').value=url;$('share-result-meta').textContent=data.share.expires_at?`有效至 ${fmt(data.share.expires_at)}`:'长期有效';$('share-result').classList.remove('hidden');await copyShareLink(false);await loadCandidateShares();toast('分享链接已生成');}catch(error){toast(error.message);}finally{button.disabled=false;}}
    async function copyShareLink(announce=true){const input=$('share-link');try{await navigator.clipboard.writeText(input.value);if(announce)toast('链接已复制');}catch(_error){input.focus();input.select();document.execCommand('copy');if(announce)toast('链接已复制');}}
    async function loadCandidateShares(){try{const data=await api('api/admin/mail/shares?limit=20');const labels={active:'有效',expired:'已过期',revoked:'已撤销'};$('share-history').innerHTML=(data.items||[]).map(item=>{const names=item.candidate_names||[];const preview=names.length?`${names.slice(0,5).join('、')}${names.length>5?`等${names.length}人`:''}`:'候选人信息不可用';const link=item.link_available&&item.token?shareUrl(item.token):'';const linkActions=link?`<button type="button" onclick="copyStoredShare('${esc(item.token)}')">复制</button><a class="button" href="${esc(link)}" target="_blank" rel="noreferrer noopener">打开</a>`:`<button type="button" onclick="reissueCandidateShare(${Number(item.id)})">生成新链接</button>`;const revoke=item.status==='active'?`<button type="button" onclick="revokeCandidateShare(${Number(item.id)})">撤销</button>`:'';return `<div class="share-history-row"><div><strong>${esc(item.title)}</strong><span>候选人：${esc(preview)}</span><span class="muted">${Number(item.item_count||0)} 人 · ${esc(fmt(item.created_at))} · ${esc(item.token_prefix)}…</span><span class="share-status ${esc(item.status)}">${labels[item.status]||esc(item.status)}</span></div><div class="share-history-actions">${linkActions}${revoke}</div></div>`;}).join('')||'<div class="empty">暂无分享记录</div>';}catch(error){$('share-history').innerHTML=`<div class="empty">${esc(error.message)}</div>`;}}
    async function copyStoredShare(token){try{await navigator.clipboard.writeText(shareUrl(token));toast('链接已复制');}catch(_error){toast('复制失败，请打开链接后复制地址');}}
    async function reissueCandidateShare(shareId){try{const data=await api('api/admin/mail/shares',{method:'POST',body:JSON.stringify({action:'reissue',share_id:shareId,expires_days:Number($('share-expiry').value)})});recordState.activeShare=data.share;$('share-link').value=shareUrl(data.share.token);$('share-result-meta').textContent=data.share.expires_at?`有效至 ${fmt(data.share.expires_at)}`:'长期有效';$('share-result').classList.remove('hidden');await copyShareLink(false);await loadCandidateShares();toast('新链接已生成并复制');}catch(error){toast(error.message);}}
    async function revokeCandidateShare(shareId){if(!confirm('撤销后，已经发出的链接会立即失效。确定撤销？'))return;try{await api('api/admin/mail/shares',{method:'POST',body:JSON.stringify({action:'revoke',share_id:shareId})});if(recordState.activeShare?.id===shareId)$('share-result').classList.add('hidden');await loadCandidateShares();toast('分享已撤销');}catch(error){toast(error.message);}}
    async function refreshAll(announce=false){await loadStatus(false);if(!$('dashboard').classList.contains('hidden'))await loadRecords();if(announce)toast('已刷新 5090 邮件与候选状态');}
    async function scanMailbox(account){try{const result=await api('api/admin/mail/scan',{method:'POST',body:JSON.stringify({account})});toast(`已启动 ${result.account==='all'?'全部邮箱':result.account} 扫描`);await loadStatus();}catch(error){toast(error.message);}}
    async function saveConfig(){const button=$('save-config');button.disabled=true;try{await api('api/admin/mail/config',{method:'POST',body:JSON.stringify({scan_interval_minutes:Number($('scan-interval').value),report_interval_hours:Number($('report-interval').value)})});toast('配置已保存');await loadStatus();}catch(error){toast(error.message);}finally{button.disabled=false;}}
    async function loginMailAdmin(event){event.preventDefault();$('admin-login-error').textContent='';try{await api('api/admin/login',{method:'POST',body:JSON.stringify({username:$('admin-username').value,password:$('admin-password').value})});$('admin-password').value='';await refreshAll();}catch(error){$('admin-login-error').textContent=error.message||'登录失败';}}
    async function logoutMailAdmin(){await api('api/admin/logout',{method:'POST',body:'{}'}).catch(()=>null);$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('auth').classList.remove('hidden');$('admin-username').focus();}
    refreshAll();setInterval(()=>loadStatus(false),15000);setInterval(loadRecords,60000);
  </script>
</body>
</html>
