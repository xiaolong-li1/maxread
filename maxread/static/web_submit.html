<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxRead</title>
  <style>
    :root{--bg:#f7f8f6;--paper:#fff;--line:#dde1dc;--line-soft:#eceeea;--text:#202521;--muted:#6f766f;--green:#236854;--green-soft:#e8f1ed;--orange:#bd6c2d;--orange-soft:#fff4e8;--red:#b23a32;--red-soft:#fff0ee;--shadow:0 16px 40px rgba(32,37,33,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;font-size:15px;line-height:1.6;letter-spacing:0}button,textarea,select,input{font:inherit;letter-spacing:0}button{cursor:pointer}.hidden{display:none!important}.shell{width:min(900px,calc(100% - 32px));margin:0 auto;padding:28px 0 118px}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:36px;height:36px;display:grid;place-items:center;background:#1e2521;color:#fff;border-radius:7px}.brand-mark svg,.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px}.header-actions{display:flex;align-items:center;gap:8px}.console-link,.account{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);text-decoration:none}.console-link:hover{border-color:#b8beb8}.account .dot{width:7px;height:7px;border-radius:50%;background:#aeb5ae}.account.bound .dot{background:var(--green)}
    main{padding-top:34px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.intro h1{font-size:28px;line-height:1.25;margin:0 0 6px;font-weight:720}.intro p{margin:0;color:var(--muted)}.service-note{display:none;padding:9px 11px;border:1px solid #ead9c9;border-radius:7px;background:#fff8f1;color:#8c5428;font-size:13px}.service-note.visible{display:block}
    .progress-panel{padding:16px 2px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.progress-panel.hidden{display:none}.progress-head,.progress-foot{display:flex;align-items:center;justify-content:space-between;gap:14px}.progress-title{min-width:0}.progress-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress-title span,.progress-foot{color:var(--muted);font-size:12px}.progress-value{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}.progress-track{height:8px;margin:12px 0 8px;border-radius:5px;background:#e3e7e2;overflow:hidden}.progress-fill{height:100%;width:0;border-radius:5px;background:var(--green);transition:width .65s ease}.progress-fill.repair{background:var(--orange)}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 10px}.section-head h2{font-size:18px;margin:0}.icon-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--muted)}.conversation{display:grid;gap:14px;min-height:180px;padding:4px 0 20px;border-top:1px solid var(--line)}.message{max-width:78%;padding-top:14px}.message.user{justify-self:end}.message.assistant{justify-self:start}.message.task-message{width:min(660px,100%);max-width:100%}.bubble{padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{border-color:#cadcd4;background:var(--green-soft)}.message.pet .bubble{border-color:#d7e2cf;background:#fbfdf9}.message-meta{display:flex;gap:8px;align-items:center;margin:5px 3px 0;color:var(--muted);font-size:11px}.message.user .message-meta{justify-content:flex-end}.empty{padding:28px 2px;color:var(--muted);border-top:1px solid var(--line)}
    .task-card{width:min(660px,100%);border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}.task-card.failed{border-color:#e4c8c5}.task-card.done{border-color:#c9dcd3}.task-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 15px 10px}.task-card-title{min-width:0}.task-card-title strong{display:block;font-size:15px;line-height:1.45}.task-card-title span{color:var(--muted);font-size:12px}.task-state{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--muted)}.task-state::before{content:"";width:7px;height:7px;border-radius:50%;background:#aab0aa}.task-state.running,.task-state.queued{color:var(--orange)}.task-state.running::before,.task-state.queued::before{background:var(--orange)}.task-state.done{color:var(--green)}.task-state.done::before{background:var(--green)}.task-state.failed{color:var(--red)}.task-state.failed::before{background:var(--red)}.task-card-body{padding:0 15px 14px;color:var(--muted);font-size:13px}.task-card-body .mini-track{height:6px;margin-top:10px;border-radius:4px;background:#e5e8e4;overflow:hidden}.task-card-body .mini-fill{height:100%;background:var(--green)}.task-error{padding:10px 12px;border-radius:6px;background:var(--red-soft);color:#8f302a}.task-card-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line-soft);background:#fbfcfa}.action-link,.retry-button{height:35px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--green);text-decoration:none}.retry-button{border-color:var(--green);background:var(--green);color:#fff;font-weight:650}.retry-button:disabled{opacity:.55;cursor:not-allowed}.technical{margin-top:8px;color:var(--muted);font-size:12px}.technical summary{cursor:pointer}.technical div{margin-top:6px;overflow-wrap:anywhere}
    .composer{margin-top:18px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:var(--shadow)}.composer textarea{display:block;width:100%;min-height:68px;max-height:180px;padding:12px 14px 5px;border:0;outline:0;resize:none;color:var(--text);background:transparent;line-height:1.55}.composer textarea::placeholder{color:#9ea59e}.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 8px 8px 13px}.composer-hint{color:var(--muted);font-size:12px}.send-button{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--green);border-radius:7px;background:var(--green);color:#fff}.send-button:disabled{opacity:.55;cursor:not-allowed}
    .pet-button{position:fixed;right:24px;bottom:22px;z-index:12;width:78px;height:104px;border:0;background:transparent;padding:0;filter:drop-shadow(0 9px 14px rgba(40,60,45,.16))}.pet-sprite{width:100%;height:100%;background-image:url("assets/web-pet-sprite.png");background-repeat:no-repeat;background-size:400% 100%;background-position:0 0;animation:petBob 2.5s ease-in-out infinite}.pet-sprite.working{background-position:33.333% 0;animation:petWork .8s ease-in-out infinite}.pet-sprite.thinking{background-position:66.666% 0}.pet-sprite.done{background-position:100% 0;animation:petCelebrate .7s ease-in-out 2}.pet-panel{position:fixed;right:28px;bottom:136px;z-index:11;width:min(340px,calc(100vw - 28px));padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 22px 64px rgba(30,40,33,.18)}.pet-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pet-panel-head strong{display:block}.pet-panel-head span{color:var(--muted);font-size:12px}.pet-speech{margin:13px 0;padding:10px 11px;border-radius:7px;background:var(--green-soft);font-size:13px}.pet-questions{display:flex;flex-wrap:wrap;gap:7px}.pet-questions button{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);font-size:12px}.pet-focus{width:100%;height:36px;margin-top:11px;border:1px solid var(--green);border-radius:7px;background:var(--green);color:#fff}.pet-close{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted)}
    dialog{width:min(430px,calc(100vw - 28px));border:1px solid var(--line);border-radius:8px;padding:0;color:var(--text);background:var(--paper);box-shadow:0 24px 80px rgba(26,31,27,.24)}dialog::backdrop{background:rgba(30,36,32,.34)}.dialog-body{padding:22px}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.dialog-head h2{font-size:20px;margin:0}.close{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted)}.bind-copy{margin:20px 0 10px;color:var(--muted);font-size:13px}.command{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:7px;background:#f8faf8}.command code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;color:var(--text)}.copy{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:var(--green)}.expires{margin-top:10px;color:var(--muted);font-size:12px}.bound-box{margin-top:20px;padding:14px;border:1px solid #cfe0d8;border-radius:7px;background:var(--green-soft)}.error{min-height:22px;margin-top:10px;color:var(--red);font-size:13px}.admin-switch{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}.admin-switch label{color:var(--muted);font-size:12px}.admin-switch select{width:100%;height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 10px}.onboarding{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.onboarding-pet{width:99px;height:132px;margin:0 auto;background:url("assets/web-pet-sprite.png") 0 0/400% 100% no-repeat}.onboarding-copy h2{margin:0 0 8px;font-size:20px}.onboarding-copy p{margin:0;color:var(--muted)}.onboarding-dots{display:flex;gap:5px;margin:16px 0}.onboarding-dots span{width:18px;height:3px;background:var(--line);border-radius:2px}.onboarding-dots span.active{background:var(--green)}.onboarding-actions{display:flex;justify-content:flex-end;gap:8px}.onboarding-actions button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff}.onboarding-actions .primary{border-color:var(--green);background:var(--green);color:#fff}.toast{position:fixed;left:50%;bottom:26px;z-index:30;transform:translate(-50%,18px);padding:9px 13px;border-radius:7px;background:#252b27;color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes petBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}@keyframes petWork{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes petCelebrate{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) scale(1.04)}}
    @media(max-width:1100px){.pet-button{right:12px;bottom:12px;width:65px;height:86px}.pet-panel{right:14px;bottom:108px}}
    @media(max-width:620px){.shell{width:calc(100% - 24px);padding-top:18px;padding-bottom:108px}header{padding-bottom:18px}.brand span{display:none}.console-link{width:38px;padding:0;justify-content:center;font-size:0}.account{max-width:38vw;overflow:hidden}.account-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{padding-top:26px}.intro{align-items:flex-start;flex-direction:column}.intro h1{font-size:24px}.message{max-width:92%}.message.task-message{width:100%;max-width:100%}.message.user{margin-right:58px}.task-card-head{gap:8px}.task-state{font-size:11px}.composer{margin-right:58px}.pet-button{width:45px;height:60px;bottom:18px}.pet-panel{bottom:86px}.onboarding{grid-template-columns:1fr;text-align:center}.onboarding-pet{margin:0 auto}.onboarding-actions{justify-content:center}}
    @media(prefers-reduced-motion:reduce){.pet-sprite,.progress-fill{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></div><div><strong>MaxRead</strong><span>论文阅读队列</span></div></div><div class="header-actions"><a class="console-link hidden" id="console-link" href="./" title="返回控制台"><span class="icon"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg></span>控制台</a><button class="account" id="account-button" onclick="openAccount()"><span class="dot"></span><span class="account-label">游客</span></button></div></header>
    <main>
      <section class="intro"><div><h1>论文会话</h1><p>提交论文，或和任务伙伴聊聊。</p></div><div class="service-note" id="service-note"></div></section>
      <section class="progress-panel hidden" id="progress-panel"><div class="progress-head"><div class="progress-title"><strong id="progress-title">当前任务</strong><span id="progress-source"></span></div><span class="progress-value" id="progress-value">0%</span></div><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div><div class="progress-foot"><span id="progress-stage">等待调度</span><span id="progress-eta"></span></div></section>
      <div class="section-head"><h2>会话</h2><button class="icon-button" aria-label="刷新" title="刷新" onclick="refreshState()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg></span></button></div>
      <section class="conversation" id="history"><div class="empty">暂无消息</div></section>
      <section class="composer"><textarea id="message-input" rows="2" placeholder="粘贴 arXiv 链接，或问 Max 任务到哪了"></textarea><div class="composer-bar"><span class="composer-hint" id="composer-hint">支持 arXiv、HuggingFace Papers 和 papers.cool</span><button class="send-button" id="send-button" aria-label="发送" title="发送" onclick="sendComposer()"><span class="icon"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="M12 13 19 5"/></svg></span></button></div></section>
    </main>
  </div>
  <button class="pet-button" id="pet-button" aria-label="打开任务伙伴" title="任务伙伴" onclick="togglePet()"><div class="pet-sprite" id="pet-sprite"></div></button>
  <aside class="pet-panel hidden" id="pet-panel"><div class="pet-panel-head"><div><strong>Max</strong><span>只读取你的任务与会话</span></div><button class="pet-close" aria-label="关闭" onclick="togglePet(false)"><span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button></div><div class="pet-speech" id="pet-speech">我会盯着任务，有问题可以问我。</div><div class="pet-questions"><button onclick="askPet('任务到哪了？')">任务到哪了</button><button onclick="askPet('还要多久？')">还要多久</button><button onclick="askPet('这个阶段在做什么？')">阶段说明</button></div><button class="pet-focus" onclick="focusComposer()">和 Max 聊聊</button></aside>
  <dialog id="account-dialog"><div class="dialog-body"><div class="dialog-head"><h2 id="account-title">绑定飞书账号</h2><button class="close" aria-label="关闭" onclick="closeAccount()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button></div><div id="account-content"></div><div class="error" id="binding-error"></div></div></dialog>
  <dialog id="onboarding-dialog"><div class="dialog-body onboarding"><div class="onboarding-pet" id="onboarding-pet"></div><div class="onboarding-copy"><h2 id="onboarding-title">把论文交给我</h2><p id="onboarding-text"></p><div class="onboarding-dots" id="onboarding-dots"></div><div class="onboarding-actions"><button onclick="finishOnboarding()">跳过</button><button class="primary" id="onboarding-next" onclick="nextOnboarding()">下一步</button></div></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const state={me:null,progress:{active:null,recent:[]},progressByJob:{},latestBySource:{},poll:null,adminAuthenticated:false,actAs:sessionStorage.getItem('maxreadActAs')||'',onboardingStep:0};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const basePath=window.location.pathname.startsWith('/maxread')?'/maxread':'';
    async function api(path,opts={}){const headers={'content-type':'application/json',...(opts.headers||{})};if(state.actAs)headers['x-maxread-act-as']=state.actAs;const response=await fetch(`${basePath}${path}`,{credentials:'same-origin',...opts,headers});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);return body}
    function icon(name){const paths={open:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',retry:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};return `<span class="icon"><svg viewBox="0 0 24 24">${paths[name]||''}</svg></span>`}
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}function minutes(seconds){return Math.max(1,Math.round(Number(seconds||0)/60))}
    async function loadMe(){try{state.me=await api('/api/web/me')}catch(error){if(state.actAs){state.actAs='';sessionStorage.removeItem('maxreadActAs');state.me=await api('/api/web/me')}else throw error}const button=$('account-button');button.classList.toggle('bound',state.me.bound);button.querySelector('.account-label').textContent=state.me.acting_as?`管理员 · ${state.me.display_name}`:(state.me.bound?state.me.display_name:'游客')}
    async function loadAdminContext(){try{const result=await api('/api/admin/status');state.adminAuthenticated=Boolean(result.authenticated)}catch(_error){state.adminAuthenticated=false}$('console-link').classList.toggle('hidden',!state.adminAuthenticated)}
    function renderService(service){const box=$('service-note');if(!service||service.mode==='operational'){box.classList.remove('visible');return}box.textContent=`服务暂缓：${service.reason||service.mode}${service.expected_recovery_at?` · ${service.expected_recovery_at}`:''}`;box.classList.add('visible')}
    async function loadProgress(){state.progress=await api('/api/web/progress');state.progressByJob=Object.fromEntries((state.progress.recent||[]).map(item=>[item.job_id,item]));state.latestBySource={};for(const item of state.progress.recent||[]){if(!state.latestBySource[item.source_id]||item.job_id>state.latestBySource[item.source_id].job_id)state.latestBySource[item.source_id]=item}renderService(state.progress.service);renderProgress();setPetState()}
    function renderProgress(){const item=state.progress.active;if(!item){$('progress-panel').classList.add('hidden');return}$('progress-panel').classList.remove('hidden');$('progress-title').textContent=item.title||`arXiv ${item.source_id}`;$('progress-source').textContent=`arXiv ${item.source_id}`;$('progress-value').textContent=`${item.percent}%`;$('progress-fill').style.width=`${item.percent}%`;$('progress-fill').classList.toggle('repair',String(item.workflow_state).includes('repair'));$('progress-stage').textContent=item.label;$('progress-eta').textContent=`预计还要 ${minutes(item.remaining_seconds)} 分钟`}
    function setPetState(){const sprite=$('pet-sprite');sprite.className='pet-sprite';const active=state.progress.active;const latest=(state.progress.recent||[])[0];if(active){sprite.classList.add(String(active.workflow_state).includes('repair')||String(active.workflow_state).includes('checking')?'thinking':'working');$('pet-speech').textContent=`${active.source_id} 正在${active.label}，约 ${active.percent}%` }else if(latest?.status==='done'){sprite.classList.add('done');$('pet-speech').textContent=`${latest.source_id} 已经完成。`}else if(latest?.status==='failed'){sprite.classList.add('thinking');$('pet-speech').textContent=`${latest.source_id} 需要你看看失败卡片。`}else{$('pet-speech').textContent='我会盯着任务，有问题可以问我。'}}
    function friendlyError(message,task){return task?.error||(/export|remote-error/.test(message.job_error||'')?'飞书 PDF 导出暂未完成，视觉验收仍在等待。':'任务没有完成，请查看后台详情或重试。')}
    function taskCard(message){const task=state.progressByJob[message.job_id]||{};const status=task.status||message.job_status||message.status||'queued';const title=task.title||message.job_title||`arXiv ${message.job_source_id||message.source_id}`;const source=task.source_id||message.job_source_id||message.source_id||'';const doc=task.doc_url||message.job_doc_url||message.doc_url||'';const isFailed=status==='failed';const latest=state.latestBySource[source];const canRetry=isFailed&&latest&&Number(latest.job_id)===Number(message.job_id);const body=isFailed?`<div class="task-error">${esc(friendlyError(message,task))}</div>`:`<div>${esc(task.label||message.content)}</div>${status==='running'||status==='queued'?`<div class="mini-track"><div class="mini-fill" style="width:${Number(task.percent||8)}%"></div></div>`:''}`;const actions=`${doc?`<a class="action-link" href="${esc(doc)}" target="_blank" rel="noopener">${icon('open')}打开文档</a>`:''}${canRetry?`<button class="retry-button" onclick="retryTask(${Number(message.job_id||0)},this)">${icon('retry')}重试</button>`:''}`;return `<div class="task-card ${esc(status)}"><div class="task-card-head"><div class="task-card-title"><strong>${esc(title)}</strong><span>论文　${esc(source)}</span></div><span class="task-state ${esc(status)}">${esc({queued:'排队中',running:'处理中',done:'已完成',failed:'未完成'}[status]||status)}</span></div><div class="task-card-body">${body}${isFailed&&message.job_error?`<details class="technical"><summary>技术详情</summary><div>${esc(message.job_error.slice(0,700))}</div></details>`:''}</div>${actions?`<div class="task-card-actions">${actions}</div>`:''}</div>`}
    function messageHtml(message){if(['queue_ack','result'].includes(message.kind)&&(message.job_id||message.source_id))return `<article class="message assistant task-message">${taskCard(message)}<div class="message-meta"><span>${esc(message.updated_at||message.created_at||'')}</span></div></article>`;const pet=message.kind==='pet_reply';const admin=message.actor_type==='admin'?'<span>管理员代入</span>':'';return `<article class="message ${esc(message.role)} ${pet?'pet':''}"><div class="bubble">${esc(message.content)}</div><div class="message-meta"><span>${pet?'Max':(message.channel==='feishu'?'飞书':'网页')}</span>${admin}<span>${esc(message.updated_at||message.created_at||'')}</span></div></article>`}
    async function loadMessages(){const rows=await api('/api/web/messages');$('history').innerHTML=rows.length?rows.map(messageHtml).join(''):'<div class="empty">把第一篇论文交给我吧。</div>'}
    async function refreshState(){try{await loadProgress();await loadMessages()}catch(_error){toast('状态暂时无法刷新')}}
    async function sendComposer(){const input=$('message-input');const text=input.value.trim();if(!text)return;const button=$('send-button');button.disabled=true;try{if(/^\s*重试(?:\s|$)/.test(text)){toast('请使用失败卡片右侧的重试按钮');return}if(/\b\d{4}\.\d{4,5}\b/.test(text)){const result=await api('/api/web/submit',{method:'POST',body:JSON.stringify({content:text})});const item=result.items[0];toast(item?.cached?'已找到现有文档':`已入队，预计 ${minutes(item?.estimated_total_seconds)} 分钟`)}else{const result=await api('/api/web/pet/chat',{method:'POST',body:JSON.stringify({content:text})});$('pet-speech').textContent=result.message?.content||'我在听。'}input.value='';updateComposer();await refreshState()}catch(error){toast(error.message)}finally{button.disabled=false}}
    $('message-input').addEventListener('input',updateComposer);$('message-input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendComposer()}});function updateComposer(){const text=$('message-input').value;const count=new Set([...text.matchAll(/\b\d{4}\.\d{4,5}\b/g)].map(x=>x[0])).size;$('composer-hint').textContent=count?`识别到 ${count} 篇论文`:'提交论文，或和 Max 聊天'}
    async function retryTask(jobId,button){button.disabled=true;try{await api('/api/web/retry',{method:'POST',body:JSON.stringify({job_id:jobId})});toast('已重新加入队列');await refreshState()}catch(error){toast(error.message);button.disabled=false}}
    function togglePet(force){const panel=$('pet-panel');const show=typeof force==='boolean'?force:panel.classList.contains('hidden');panel.classList.toggle('hidden',!show)}function focusComposer(){togglePet(false);$('message-input').focus()}async function askPet(text){togglePet(true);$('pet-speech').textContent='我查一下当前任务。';try{const result=await api('/api/web/pet/chat',{method:'POST',body:JSON.stringify({content:text})});$('pet-speech').textContent=result.message?.content||'我在听。';await refreshState()}catch(error){$('pet-speech').textContent=error.message}}
    async function loadAdminAccounts(){try{const status=await api('/api/admin/status');state.adminAuthenticated=Boolean(status.authenticated);if(!state.adminAuthenticated)return '';const accounts=await api('/api/web/admin/accounts');return `<div class="admin-switch"><label for="admin-account">管理员代入用户</label><select id="admin-account" onchange="setActAs(this.value)"><option value="">我的网页身份</option>${accounts.map(a=>`<option value="${esc(a.public_id)}" ${a.public_id===state.actAs?'selected':''}>${esc(a.display_name||'游客')} · ${esc(a.account_type)} · ${esc(a.submission_count)}</option>`).join('')}</select></div>`}catch(_error){return ''}}
    async function setActAs(publicId){state.actAs=publicId;if(publicId)sessionStorage.setItem('maxreadActAs',publicId);else sessionStorage.removeItem('maxreadActAs');await loadMe();await refreshState();closeAccount();toast(publicId?'已进入用户态':'已退出用户态')}async function openAccount(){$('binding-error').textContent='';$('account-dialog').showModal();const admin=await loadAdminAccounts();if(state.me?.acting_as){$('account-title').textContent='管理员代入态';$('account-content').innerHTML=`<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>操作会记录管理员审计标记</span></div>${admin}`;return}if(state.me?.bound){$('account-title').textContent='飞书账号';$('account-content').innerHTML=`<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>网页与飞书提交共享同一会话</span></div>${admin}`;return}$('account-title').textContent='绑定飞书账号';$('account-content').innerHTML='<div class="bind-copy">正在生成绑定码...</div>';try{const data=await api('/api/web/binding-code',{method:'POST',body:'{}'});$('account-content').innerHTML=`<div class="bind-copy">在飞书私聊「读不动了」发送：</div><div class="command"><code>${esc(data.command)}</code><button class="copy" aria-label="复制" onclick="copyCommand('${esc(data.command)}')">${icon('copy')}</button></div><div class="expires">绑定码 10 分钟内有效，完成后页面会自动更新。</div>${admin}`;pollBinding()}catch(error){$('binding-error').textContent=error.message}}function closeAccount(){$('account-dialog').close()}async function copyCommand(command){await navigator.clipboard.writeText(command);toast('已复制')}async function pollBinding(){for(let i=0;i<120&&$('account-dialog').open;i++){await new Promise(r=>setTimeout(r,2000));await loadMe();if(state.me.bound){$('account-title').textContent='绑定成功';$('account-content').innerHTML=`<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>网页与飞书会话已经合并</span></div>`;await refreshState();return}}}
    const onboarding=[['把论文交给我','在底部输入框粘贴 arXiv、HuggingFace Papers 或 papers.cool 链接。'],['我会盯住每一步','顶部进度来自真实状态机；点右下角的我，可以随时问阶段和预计时间。'],['会话可以跟着你','绑定飞书后，网页和飞书共享身份与会话；失败任务直接点卡片上的重试。']];function renderOnboarding(){const [title,text]=onboarding[state.onboardingStep];$('onboarding-title').textContent=title;$('onboarding-text').textContent=text;$('onboarding-pet').style.backgroundPosition=`${state.onboardingStep*33.333}% 0`;$('onboarding-dots').innerHTML=onboarding.map((_,i)=>`<span class="${i===state.onboardingStep?'active':''}"></span>`).join('');$('onboarding-next').textContent=state.onboardingStep===onboarding.length-1?'开始使用':'下一步'}function nextOnboarding(){if(state.onboardingStep<onboarding.length-1){state.onboardingStep++;renderOnboarding()}else finishOnboarding()}function finishOnboarding(){localStorage.setItem('maxreadOnboardingSeen','1');$('onboarding-dialog').close()}function maybeOnboard(){if(!localStorage.getItem('maxreadOnboardingSeen')){renderOnboarding();$('onboarding-dialog').showModal()}}
    async function boot(){await Promise.all([loadMe(),loadAdminContext(),refreshState()]);state.poll=setInterval(refreshState,4000);maybeOnboard()}boot().catch(()=>toast('页面初始化失败'));
  </script>
</body>
