<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxRead · 我的论文项目</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --paper: #ffffff;
      --line: #dce1db;
      --line-soft: #ecefeb;
      --text: #202521;
      --muted: #707870;
      --green: #246b56;
      --green-soft: #e8f2ed;
      --orange: #b9692c;
      --orange-soft: #fff4e8;
      --red: #b33d35;
      --red-soft: #fff0ee;
      --shadow: 0 16px 42px rgba(34, 42, 36, 0.07);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0;
    }
    button, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .icon { display: inline-grid; place-items: center; flex: 0 0 auto; }
    .icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .shell { width: min(1040px, calc(100% - 36px)); margin: 0 auto; padding: 26px 0 84px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 2px 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #202722;
      border-radius: 7px;
    }
    .brand-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand strong { display: block; font-size: 17px; line-height: 1.3; }
    .brand span { display: block; color: var(--muted); font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .console-link, .admin-link, .account {
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      text-decoration: none;
    }
    .console-link:hover, .admin-link:hover, .account:hover { border-color: #b8c0b9; }
    .account .dot { width: 7px; height: 7px; border-radius: 50%; background: #aeb5ae; }
    .account.bound .dot { background: var(--green); }
    main { padding-top: 34px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .intro h1 { margin: 0 0 5px; font-size: 28px; line-height: 1.25; font-weight: 720; }
    .intro p { margin: 0; color: var(--muted); }
    .identity-note { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .service-note {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      color: #885126;
      background: #fff8f1;
      border: 1px solid #ead8c8;
      border-radius: 7px;
    }
    .service-note.visible { display: block; }
    .submit-box {
      margin-top: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 10px;
      padding: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .submit-input { position: relative; min-width: 0; }
    .submit-input .link-icon { position: absolute; left: 11px; top: 12px; color: var(--green); }
    .submit-box textarea {
      display: block;
      width: 100%;
      min-height: 52px;
      max-height: 150px;
      padding: 10px 12px 7px 42px;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      resize: none;
      line-height: 1.55;
    }
    .submit-box textarea::placeholder { color: #9ca39c; }
    .submit-meta { padding-left: 42px; color: var(--muted); font-size: 12px; }
    .submit-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 15px;
      color: #fff;
      background: var(--green);
      border: 1px solid var(--green);
      border-radius: 7px;
      font-weight: 650;
      white-space: nowrap;
    }
    .submit-button:disabled { opacity: 0.55; cursor: not-allowed; }
    .projects-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 38px 0 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .projects-head h2 { margin: 0; font-size: 19px; }
    .project-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .project-search { position: relative; }
    .project-search .icon { position: absolute; left: 9px; top: 8px; color: var(--muted); pointer-events: none; }
    .project-search input { width: 190px; height: 34px; padding: 0 10px 0 32px; color: var(--text); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; outline: 0; }
    .category-filter, .category-select { height: 34px; padding: 0 27px 0 9px; color: var(--text); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; }
    .filters {
      display: inline-flex;
      padding: 3px;
      background: #e9ece8;
      border-radius: 7px;
    }
    .filters button {
      height: 30px;
      padding: 0 10px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 5px;
      font-size: 12px;
    }
    .filters button.active { color: var(--text); background: var(--paper); box-shadow: 0 1px 4px rgba(30, 38, 32, 0.08); }
    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .organize-button {
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      color: #fff;
      background: var(--green);
      border: 1px solid var(--green);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 620;
    }
    .organize-button:disabled { opacity: 0.55; cursor: wait; }
    .projects { display: grid; gap: 22px; }
    .category-group { display: grid; gap: 10px; }
    .category-head-row { display: flex; align-items: center; gap: 12px; }
    .category-heading { width: 100%; display: flex; align-items: center; gap: 8px; margin: 0; padding: 2px 0; color: var(--muted); background: transparent; border: 0; font-size: 12px; font-weight: 620; text-align: left; cursor: pointer; }
    .category-heading::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .category-chevron { width: 16px; height: 16px; transition: transform 0.18s ease; }
    .category-heading.collapsed .category-chevron { transform: rotate(-90deg); }
    .category-count { color: #9aa19a; font-variant-numeric: tabular-nums; }
    .category-list { display: grid; gap: 12px; }
    .category-list[hidden] { display: none; }
    .unclassified-toolbar { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .select-all { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; }
    .select-all input, .project-select input { width: 16px; height: 16px; accent-color: var(--green); }
    .project-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      align-items: center;
      gap: 10px;
    }
    .project-row.completed { grid-template-columns: minmax(0, 1fr); }
    .project-card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .project-card.failed { border-color: #e5c9c6; }
    .project-card.done { border-color: #c9ddd4; }
    .project-card.selected { border-color: var(--green); box-shadow: 0 0 0 1px rgba(30, 112, 86, 0.12); }
    .project-main { padding: 15px 16px 13px; }
    .project-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .project-title-wrap { min-width: 0; display: flex; align-items: flex-start; gap: 10px; }
    .project-select { display: inline-flex; align-items: center; padding-top: 2px; cursor: pointer; }
    .project-title { min-width: 0; }
    .project-title strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-title span { color: var(--muted); font-size: 12px; }
    .project-summary { margin: 8px 0 0; color: #566057; font-size: 13px; line-height: 1.5; }
    .project-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .project-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #acb3ac; }
    .project-state.queued, .project-state.running { color: var(--orange); }
    .project-state.queued::before, .project-state.running::before { background: var(--orange); }
    .project-state.done { color: var(--green); }
    .project-state.done::before { background: var(--green); }
    .project-state.failed { color: var(--red); }
    .project-state.failed::before { background: var(--red); }
    .project-progress { margin-top: 13px; }
    .project-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .project-progress-head strong { color: var(--text); font-weight: 620; }
    .track { height: 7px; margin-top: 7px; overflow: hidden; background: #e5e8e4; border-radius: 5px; }
    .fill { height: 100%; background: var(--green); border-radius: 5px; transition: width 0.55s ease; }
    .fill.repair { background: var(--orange); }
    .project-error { margin-top: 11px; padding: 9px 11px; color: #91332d; background: var(--red-soft); border-radius: 6px; font-size: 13px; }
    .technical { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .technical summary { cursor: pointer; }
    .technical div { margin-top: 5px; overflow-wrap: anywhere; }
    .project-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding: 7px 11px 7px 16px;
      background: #fbfcfa;
      border-top: 1px solid var(--line-soft);
    }
    .project-updated { color: var(--muted); font-size: 11px; }
    .category-pending { color: var(--muted); font-size: 12px; }
    .action-group { display: flex; align-items: center; gap: 7px; }
    .project-organize { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .category-select { max-width: 145px; height: 32px; color: var(--muted); font-size: 12px; }
    .project-icon-action { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 7px; }
    .project-icon-action.favorite { color: #a86123; background: var(--orange-soft); border-color: #ead4bd; }
    .project-icon-action.delete:hover { color: var(--red); border-color: #e2c4c1; }
    .action-link, .retry-button {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      color: var(--green);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      text-decoration: none;
    }
    .retry-button { color: #fff; background: var(--green); border-color: var(--green); font-weight: 620; }
    .retry-button:disabled { opacity: 0.55; cursor: not-allowed; }
    .pet-dock { align-self: stretch; display: grid; align-content: center; justify-items: center; min-height: 150px; }
    .project-pet {
      width: 72px;
      height: 96px;
      padding: 0;
      background: transparent;
      border: 0;
      filter: drop-shadow(0 9px 12px rgba(39, 58, 45, 0.14));
    }
    .pet-sprite {
      width: 100%;
      height: 100%;
      background-image: url("assets/web-pet-sprite.png");
      background-repeat: no-repeat;
      background-size: 400% 100%;
      background-position: 0 0;
      animation: pet-bob 2.5s ease-in-out infinite;
    }
    .pet-sprite.working { background-position: 33.333% 0; animation: pet-work 0.85s ease-in-out infinite; }
    .pet-sprite.thinking { background-position: 66.666% 0; }
    .pet-sprite.done { background-position: 100% 0; animation: pet-done 0.75s ease-in-out 2; }
    .pet-label { margin-top: -3px; color: var(--muted); font-size: 11px; }
    .max-mover { position: fixed; z-index: 45; width: 62px; height: 82px; pointer-events: none; filter: drop-shadow(0 9px 12px rgba(39, 58, 45, 0.18)); }
    .max-mover .pet-sprite { background-position: 33.333% 0; animation: pet-work 0.7s ease-in-out infinite; }
    .max-mover span { position: absolute; top: 78px; left: 50%; padding: 4px 7px; color: var(--green); background: var(--paper); border: 1px solid #bad4c8; border-radius: 6px; box-shadow: 0 8px 22px rgba(27, 53, 39, .13); font-size: 11px; font-weight: 650; white-space: nowrap; transform: translateX(-50%); }
    .project-arrived .project-card { animation: project-arrived 0.85s ease-out; }
    .category-arrived { animation: category-arrived 1.15s ease-out; }
    .empty { padding: 38px 2px; color: var(--muted); }
    .pet-panel {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      width: min(360px, calc(100vw - 28px));
      height: min(520px, calc(100vh - 44px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 72px rgba(28, 36, 30, 0.2);
      overflow: hidden;
    }
    .pet-panel-head { display: grid; grid-template-columns: 42px minmax(0, 1fr) 32px; align-items: center; gap: 9px; padding: 10px 11px; border-bottom: 1px solid var(--line-soft); }
    .pet-panel-avatar { width: 38px; height: 51px; background: url("assets/web-pet-sprite.png") 0 0 / 400% 100% no-repeat; }
    .pet-panel-title { min-width: 0; }
    .pet-panel-title strong { display: block; font-size: 14px; }
    .pet-panel-title span { display: block; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .pet-close { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); background: transparent; border: 0; }
    .pet-chat { min-height: 0; overflow-y: auto; padding: 12px 11px; background: #fafbf9; }
    .pet-message { max-width: 84%; margin-bottom: 8px; }
    .pet-message.user { margin-left: auto; }
    .pet-bubble { padding: 8px 9px; background: #fff; border: 1px solid var(--line-soft); border-radius: 7px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    .pet-message.user .pet-bubble { background: var(--green-soft); border-color: #c9ddd4; }
    .pet-pending { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
    .thinking-dots { display: inline-flex; gap: 3px; }
    .thinking-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: thinking 1s ease-in-out infinite; }
    .thinking-dots i:nth-child(2) { animation-delay: .15s; }
    .thinking-dots i:nth-child(3) { animation-delay: .3s; }
    .pet-quick { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 8px 9px 0; }
    .pet-quick button { height: 30px; padding: 0 8px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
    .pet-composer { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 7px; padding: 9px; background: #fff; border-top: 1px solid var(--line-soft); }
    .pet-composer textarea { width: 100%; min-height: 38px; max-height: 100px; padding: 8px 9px; color: var(--text); background: #fafbf9; border: 1px solid var(--line); border-radius: 7px; outline: 0; resize: none; }
    .pet-send { width: 38px; height: 38px; display: grid; place-items: center; color: #fff; background: var(--green); border: 1px solid var(--green); border-radius: 7px; }
    dialog { width: min(430px, calc(100vw - 28px)); padding: 0; color: var(--text); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 80px rgba(26, 31, 27, 0.24); }
    dialog::backdrop { background: rgba(30, 36, 32, 0.34); }
    .dialog-body { padding: 22px; }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .dialog-head h2 { margin: 0; font-size: 20px; }
    .close { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); background: transparent; border: 0; }
    .bind-copy { margin: 20px 0 10px; color: var(--muted); font-size: 13px; }
    .command { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 13px; background: #f8faf8; border: 1px solid var(--line); border-radius: 7px; }
    .command code { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; }
    .copy { width: 34px; height: 34px; display: grid; place-items: center; color: var(--green); background: transparent; border: 0; }
    .expires { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .bound-box { margin-top: 20px; padding: 14px; background: var(--green-soft); border: 1px solid #cfe0d8; border-radius: 7px; }
    .error { min-height: 22px; margin-top: 10px; color: var(--red); font-size: 13px; }
    .admin-switch { display: grid; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
    .admin-switch label { color: var(--muted); font-size: 12px; }
    .admin-switch select { width: 100%; height: 40px; padding: 0 10px; background: #fff; border: 1px solid var(--line); border-radius: 7px; }
    .tour-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(23, 29, 25, 0.46); pointer-events: none; }
    .tour-target { position: relative !important; z-index: 51 !important; border-radius: 8px; box-shadow: 0 0 0 4px #fff, 0 0 0 7px #4d977e, 0 18px 54px rgba(18, 35, 27, 0.28) !important; }
    .tour-coach {
      position: fixed;
      z-index: 52;
      width: min(360px, calc(100vw - 24px));
      padding: 14px;
      background: var(--paper);
      border: 1px solid #bfd5ca;
      border-radius: 8px;
      box-shadow: 0 22px 64px rgba(20, 31, 25, 0.28);
    }
    .tour-coach-head { display: grid; grid-template-columns: 43px minmax(0, 1fr); align-items: center; gap: 10px; }
    .tour-coach-pet { width: 42px; height: 56px; background: url("assets/web-pet-sprite.png") 100% 0 / 400% 100% no-repeat; }
    .tour-eyebrow { color: var(--green); font-size: 11px; font-weight: 700; }
    .tour-coach h2 { margin: 1px 0 0; font-size: 17px; line-height: 1.35; }
    .tour-coach p { margin: 10px 0 12px; color: #4f5951; font-size: 13px; line-height: 1.7; }
    .tour-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tour-actions-left, .tour-actions-right { display: flex; align-items: center; gap: 7px; }
    .tour-actions button { height: 34px; padding: 0 10px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 7px; }
    .tour-actions button.primary { color: #fff; background: var(--green); border-color: var(--green); }
    .tour-actions button:disabled { opacity: 0.45; cursor: default; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; padding: 9px 13px; color: #fff; background: #252b27; border-radius: 7px; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: 0.2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @keyframes pet-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes pet-work { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pet-done { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(4deg) scale(1.04); } }
    @keyframes project-arrived { 0% { border-color: #7cb49c; box-shadow: 0 0 0 3px rgba(40, 119, 91, 0.13); } 100% { border-color: var(--line); box-shadow: none; } }
    @keyframes category-arrived { 0%, 45% { color: var(--green); background: var(--green-soft); box-shadow: 0 0 0 5px var(--green-soft); } 100% { color: var(--muted); background: transparent; box-shadow: none; } }
    @keyframes thinking { 0%, 70%, 100% { opacity: .35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }
    @media (max-width: 680px) {
      .shell { width: calc(100% - 24px); padding-top: 18px; }
      header { padding-bottom: 17px; }
      .brand span { display: none; }
      .console-link, .admin-link { width: 38px; padding: 0; justify-content: center; font-size: 0; }
      .account { max-width: 39vw; overflow: hidden; }
      .account-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { padding-top: 26px; }
      .intro { align-items: flex-start; flex-direction: column; gap: 8px; }
      .intro h1 { font-size: 24px; }
      .identity-note { white-space: normal; }
      .submit-box { grid-template-columns: 1fr; }
      .submit-button { justify-content: center; }
      .projects-head { align-items: flex-start; flex-direction: column; }
      .project-tools { width: 100%; justify-content: flex-start; }
      .project-search { flex: 1; min-width: 150px; }
      .project-search input { width: 100%; }
      .project-row { grid-template-columns: minmax(0, 1fr) 60px; gap: 2px; }
      .project-pet { width: 48px; height: 64px; }
      .pet-dock { min-height: 120px; }
      .pet-label { font-size: 10px; }
      .project-top { gap: 8px; }
      .project-title strong { white-space: normal; }
      .project-actions { align-items: stretch; flex-direction: column; }
      .project-organize { justify-content: space-between; }
      .action-group { width: 100%; justify-content: flex-end; }
      .pet-panel { right: 8px; bottom: 8px; width: calc(100vw - 16px); height: min(620px, calc(100vh - 16px)); }
      .tour-coach { left: 12px !important; right: 12px; width: auto; }
    }
    @media (prefers-reduced-motion: reduce) { .pet-sprite, .fill, .project-arrived .project-card { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></div>
        <div><strong>MaxRead</strong><span>个人论文项目台</span></div>
      </div>
      <div class="header-actions">
        <a class="console-link" id="console-link" href="./projects" title="返回个人控制台"><span class="icon"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg></span>个人控制台</a>
        <a class="console-link" id="pipeline-link" data-guide="pipeline" href="./architecture" title="查看 Pipeline 架构"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h6v6H4zM14 3h6v6h-6zM14 15h6v6h-6zM10 9l4-3M10 11l4 6"/></svg></span>Pipeline 架构</a>
        <a class="admin-link" id="admin-link" href="./admin" title="管理员控制台"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>管理员</a>
        <button class="account" id="account-button" data-guide="account" onclick="openAccount()"><span class="dot"></span><span class="account-label">游客</span></button>
      </div>
    </header>
    <main>
      <section class="intro">
        <div><h1>我的论文项目</h1><p>每篇论文独立跟踪，状态原位更新。</p></div>
        <span class="identity-note" id="identity-note">仅显示当前账号的项目</span>
      </section>
      <div class="service-note" id="service-note"></div>
      <section class="submit-box" aria-label="提交论文" data-guide="submit">
        <div class="submit-input">
          <span class="icon link-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg></span>
          <textarea id="paper-input" rows="2" placeholder="粘贴 arXiv 链接或论文 ID"></textarea>
          <div class="submit-meta" id="submit-meta">支持 arXiv、HuggingFace Papers 和 papers.cool</div>
        </div>
        <button class="submit-button" id="submit-button" onclick="submitPapers()"><span class="icon"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="M12 13 19 5"/></svg></span>开始阅读</button>
      </section>
      <section id="projects-section">
        <div class="projects-head">
          <h2>项目</h2>
          <div class="project-tools" data-guide="project-tools">
            <div class="project-search"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input id="project-search" type="search" placeholder="搜索标题或 arXiv ID" oninput="setSearch(this.value)" /></div>
            <select class="category-filter" id="category-filter" aria-label="分类筛选" onchange="setCategoryFilter(this.value)"><option value="all">全部分类</option></select>
            <div class="filters" role="tablist" aria-label="项目筛选">
              <button class="active" data-filter="all" onclick="setFilter('all')">全部</button>
              <button data-filter="favorite" onclick="setFilter('favorite')">收藏</button>
              <button data-filter="active" onclick="setFilter('active')">进行中</button>
              <button data-filter="done" onclick="setFilter('done')">已完成</button>
            </div>
            <button class="icon-button" data-guide="help" aria-label="让 Max 带我操作页面" title="让 Max 带我操作页面" onclick="showButtonGuide()"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4"/><path d="M12 18h.01"/></svg></span></button>
            <button class="icon-button" aria-label="刷新" title="刷新" onclick="refreshProjects()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg></span></button>
          </div>
        </div>
        <div class="projects" id="projects"><div class="empty">正在读取项目...</div></div>
      </section>
    </main>
  </div>

  <aside class="pet-panel hidden" id="pet-panel" aria-label="项目伙伴对话">
    <div class="pet-panel-head">
      <div class="pet-panel-avatar" id="pet-panel-avatar"></div>
      <div class="pet-panel-title"><strong>Max</strong><span id="pet-project-title">当前项目</span></div>
      <button class="pet-close" aria-label="关闭" onclick="closePet()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button>
    </div>
    <div class="pet-chat" id="pet-chat"></div>
    <div>
      <div class="pet-quick" id="pet-quick"><button onclick="startPageTour()">带我看页面</button><button onclick="startBindingTour()">绑定飞书</button><button onclick="askPet('进度到哪里了？')">当前进度</button><button onclick="askPet('还要多久？')">预计时间</button></div>
      <div class="pet-composer">
        <textarea id="pet-input" rows="1" placeholder="问 Max 这个项目的情况"></textarea>
        <button class="pet-send" id="pet-send" aria-label="发送" onclick="sendPetMessage()"><span class="icon"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="M12 13 19 5"/></svg></span></button>
      </div>
    </div>
  </aside>

  <div class="tour-backdrop hidden" id="tour-backdrop"></div>
  <aside class="tour-coach hidden" id="tour-coach" aria-live="polite">
    <div class="tour-coach-head"><div class="tour-coach-pet"></div><div><div class="tour-eyebrow" id="tour-counter">MAX 使用向导</div><h2 id="tour-title"></h2></div></div>
    <p id="tour-text"></p>
    <div class="tour-actions"><div class="tour-actions-left"><button onclick="stopPageTour()">结束</button></div><div class="tour-actions-right"><button id="tour-previous" onclick="previousTourStep()">上一步</button><button class="primary" id="tour-next" onclick="nextTourStep()">下一步</button></div></div>
  </aside>

  <dialog id="account-dialog"><div class="dialog-body"><div class="dialog-head"><h2 id="account-title">绑定飞书账号</h2><button class="close" aria-label="关闭" onclick="closeAccount()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button></div><div id="account-content"></div><div class="error" id="binding-error"></div></div></dialog>
  <div class="toast" id="toast"></div>

  <script>
    const storedCollapsedCategories = (() => {
      try { return JSON.parse(localStorage.getItem('maxreadCollapsedCategories') || '[]'); }
      catch (_error) { return []; }
    })();
    const state = {
      me: null,
      projects: [],
      service: null,
      filter: 'all',
      category: 'all',
      query: '',
      categories: [],
      poll: null,
      adminAuthenticated: false,
      actAs: sessionStorage.getItem('maxreadActAs') || '',
      petProject: null,
      petChats: {},
      petBusy: false,
      selectedProjects: new Set(),
      tourStep: 0,
      tourSteps: [],
      tourTarget: null,
      projectMoveBusy: false,
      collapsedCategories: new Set(storedCollapsedCategories),
    };
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const basePath = window.location.pathname.startsWith('/maxread') ? '/maxread' : '';

    async function api(path, options = {}) {
      const headers = {'content-type': 'application/json', ...(options.headers || {})};
      if (state.actAs) headers['x-maxread-act-as'] = state.actAs;
      const response = await fetch(`${basePath}${path}`, {credentials: 'same-origin', ...options, headers});
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      return body;
    }

    function icon(name) {
      const paths = {
        open: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        retry: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
        star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2l-5-4.9 6.9-1Z"/>',
        trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/>',
      };
      return `<span class="icon"><svg viewBox="0 0 24 24">${paths[name] || ''}</svg></span>`;
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      setTimeout(() => $('toast').classList.remove('show'), 1900);
    }

    function minutes(seconds) { return Math.max(1, Math.round(Number(seconds || 0) / 60)); }
    function stateLabel(status) { return ({queued:'排队中', running:'处理中', done:'已完成', failed:'未完成', cancelled:'已取消'})[status] || '已记录'; }
    function petFrame(project) {
      if (project.status === 'done') return 'done';
      if (project.status === 'running') return 'working';
      if (project.status === 'queued') return 'thinking';
      return '';
    }
    function friendlyError(project) {
      const error = String(project.error || '');
      if (error.includes('飞书 PDF 导出超时')) return '飞书 PDF 导出仍在等待，项目可继续重试验收';
      return error || '这次没有完成，可以从当前卡片重新尝试';
    }

    async function loadMe() {
      const previousIdentity = state.me?.public_id || '';
      try {
        state.me = await api('/api/web/me');
      } catch (error) {
        if (!state.actAs) throw error;
        state.actAs = '';
        sessionStorage.removeItem('maxreadActAs');
        state.me = await api('/api/web/me');
      }
      if (previousIdentity && previousIdentity !== state.me.public_id) state.selectedProjects.clear();
      const button = $('account-button');
      button.classList.toggle('bound', state.me.bound);
      button.querySelector('.account-label').textContent = state.me.acting_as ? `管理员 · ${state.me.display_name}` : (state.me.bound ? state.me.display_name : '游客');
      $('identity-note').textContent = state.me.acting_as ? `正在查看 ${state.me.display_name} 的项目` : `仅显示 ${state.me.display_name || '当前账号'} 的项目`;
    }

    async function loadAdminContext() {
      try {
        const result = await api('/api/admin/status');
        state.adminAuthenticated = Boolean(result.authenticated);
      } catch (_error) {
        state.adminAuthenticated = false;
      }
      $('admin-link').title = state.adminAuthenticated ? '进入管理员控制台' : '管理员登录';
    }

    function renderService() {
      const box = $('service-note');
      if (!state.service || state.service.mode === 'operational') {
        box.classList.remove('visible');
        return;
      }
      box.textContent = `服务暂缓：${state.service.reason || state.service.mode}${state.service.expected_recovery_at ? ` · ${state.service.expected_recovery_at}` : ''}`;
      box.classList.add('visible');
    }

    function visibleProjects() {
      let rows = state.projects;
      if (state.filter === 'favorite') rows = rows.filter(item => item.favorite);
      if (state.filter === 'active') rows = rows.filter(item => ['queued', 'running'].includes(item.status));
      if (state.filter === 'done') rows = rows.filter(item => item.status === 'done');
      if (state.category !== 'all') rows = rows.filter(item => item.category === state.category);
      const query = state.query.trim().toLowerCase();
      if (query) rows = rows.filter(item => `${item.title || ''} ${item.source_id || ''}`.toLowerCase().includes(query));
      return rows;
    }

    function categoryOptions(selected) {
      return state.categories.filter(category => !['进行中', '已完成未分类'].includes(category)).map(category => `<option value="${esc(category)}" ${category === selected ? 'selected' : ''}>${esc(category)}</option>`).join('');
    }

    function projectHtml(project) {
      const title = project.title || `arXiv ${project.source_id}`;
      const status = project.status || 'queued';
      const percent = Math.max(0, Math.min(100, Number(project.percent || 0)));
      const repair = String(project.workflow_state || '').includes('repair');
      const eta = project.remaining_seconds
        ? `约 ${minutes(project.remaining_seconds)} 分钟`
        : (project.overdue ? `已运行 ${minutes(project.elapsed_seconds)} 分钟，超过近期均值` : '');
      const error = status === 'failed' ? `<div class="project-error">${esc(friendlyError(project))}</div>${project.error ? `<details class="technical"><summary>技术详情</summary><div>${esc(String(project.error).slice(0, 700))}</div></details>` : ''}` : '';
      const doc = project.doc_url ? `<a class="action-link" href="${esc(project.doc_url)}" target="_blank" rel="noopener">${icon('open')}打开文档</a>` : '';
      const retry = status === 'failed' && Number(project.job_id) > 0 ? `<button class="retry-button" data-guide="retry" onclick="retryProject(${Number(project.job_id)}, this)">${icon('retry')}重试</button>` : '';
      const favorite = `<button class="project-icon-action ${project.favorite ? 'favorite' : ''}" aria-label="${project.favorite ? '取消收藏' : '收藏'}" title="${project.favorite ? '取消收藏' : '收藏'}" onclick="toggleFavorite('${esc(project.source_id)}', ${project.favorite ? 'false' : 'true'})">${icon('star')}</button>`;
      const remove = `<button class="project-icon-action delete" aria-label="删除项目" title="从我的项目中删除" onclick="deleteProject('${esc(project.source_id)}')">${icon('trash')}</button>`;
      const progress = status === 'done' ? '' : `<div class="project-progress" data-guide="progress"><div class="project-progress-head"><strong>${esc(project.label || '等待调度')}</strong><span>${percent}%${eta ? ` · ${esc(eta)}` : ''}</span></div><div class="track"><div class="fill ${repair ? 'repair' : ''}" style="width:${percent}%"></div></div></div>`;
      const companion = status === 'done' ? '' : `<div class="pet-dock" data-guide="project-pet"><button class="project-pet" aria-label="询问 Max 当前项目" title="问 Max" onclick="openPet(${Number(project.job_id || 0)}, '${esc(project.source_id)}')"><div class="pet-sprite ${petFrame(project)}"></div></button><span class="pet-label">问 Max</span></div>`;
      const selectable = Boolean(state.me?.bound && project.status === 'done' && project.category === '已完成未分类');
      const checked = state.selectedProjects.has(project.source_id);
      const selector = selectable ? `<label class="project-select" title="选择这个项目"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleProjectSelection('${esc(project.source_id)}', this.checked)" /></label>` : '';
      const categoryLabel = project.category_source === 'manual' ? '人工分类' : project.category_source === 'ai' ? '智能整理' : project.category_source === 'unclassified' ? '等待归类' : '状态分类';
      const categoryControl = project.category_source === 'status'
        ? '<span class="category-pending">完成后进入未分类</span>'
        : project.category_source === 'unclassified'
          ? `<select class="category-select" aria-label="手动分类" onchange="changeCategory('${esc(project.source_id)}', this.value)"><option value="" selected disabled>手动分类</option>${categoryOptions('')}</select><span class="project-updated">${categoryLabel}</span>`
          : `<select class="category-select" aria-label="调整项目分类" onchange="changeCategory('${esc(project.source_id)}', this.value)">${categoryOptions(project.category)}</select><span class="project-updated">${categoryLabel}</span>`;
      const retryHistory = [];
      if (Number(project.user_retries || 0) > 0) retryHistory.push(`用户重试 ${Number(project.user_retries)} 次`);
      if (Number(project.auto_retries || 0) > 0) retryHistory.push(`自动重试 ${Number(project.auto_retries)} 次`);
      if (Number(project.service_recoveries || 0) > 0) retryHistory.push(`服务恢复 ${Number(project.service_recoveries)} 次`);
      const retrySummary = retryHistory.length ? ` · ${retryHistory.join(' · ')}` : '';
      return `<article class="project-row ${status === 'done' ? 'completed' : ''}" data-source="${esc(project.source_id)}" data-category="${esc(project.category || '其他')}">
        <div class="project-card ${esc(status)} ${checked ? 'selected' : ''}" data-guide="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-title-wrap">${selector}<div class="project-title"><strong>${esc(title)}</strong><span>arXiv ${esc(project.source_id)}${esc(retrySummary)}</span></div></div>
              <span class="project-state ${esc(status)}">${esc(stateLabel(status))}</span>
            </div>
            ${project.summary ? `<p class="project-summary">${esc(project.summary)}</p>` : ''}
            ${progress}
            ${error}
          </div>
          <div class="project-actions" data-guide="project-actions"><div class="project-organize">${categoryControl}</div><div class="action-group">${favorite}${doc}${retry}${remove}</div></div>
        </div>
        ${companion}
      </article>`;
    }

    function renderProjects() {
      const rows = visibleProjects();
      if (!rows.length) {
        $('projects').innerHTML = '<div class="empty">这个筛选下还没有项目。</div>';
      } else {
        const groups = new Map();
        for (const project of rows) {
          const category = project.category || '其他';
          if (!groups.has(category)) groups.set(category, []);
          groups.get(category).push(project);
        }
        const categoryRank = category => category === '进行中' ? 0 : category === '已完成未分类' ? 1 : 2;
        const groupedRows = [...groups.entries()].sort((left, right) => categoryRank(left[0]) - categoryRank(right[0]));
        $('projects').innerHTML = groupedRows.map(([category, projects]) => {
          const collapsed = state.collapsedCategories.has(category);
          const selectedCount = projects.filter(project => state.selectedProjects.has(project.source_id)).length;
          const toolbar = category === '已完成未分类' && state.me?.bound
            ? `<div class="unclassified-toolbar" data-guide="organize"><label class="select-all"><input type="checkbox" ${projects.length && selectedCount === projects.length ? 'checked' : ''} onchange="toggleAllUnclassified(this.checked)" />全选</label><button class="organize-button" ${selectedCount ? '' : 'disabled'} onclick="organizeSelectedProjects()" title="只整理勾选的未分类项目"><span class="icon"><svg viewBox="0 0 24 24"><path d="m12 3-1.9 4.1L6 9l4.1 1.9L12 15l1.9-4.1L18 9l-4.1-1.9Z"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4"/></svg></span><span id="organize-label">自动归类所选${selectedCount ? ` (${selectedCount})` : ''}</span></button></div>`
            : '';
          return `<section class="category-group" data-category="${esc(category)}"><div class="category-head-row"><button class="category-heading ${collapsed ? 'collapsed' : ''}" data-guide="category-heading" onclick="toggleCategory('${esc(category)}')" aria-expanded="${collapsed ? 'false' : 'true'}"><span class="icon category-chevron"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span><span>${esc(category)}</span><span class="category-count">${projects.length}</span></button>${toolbar}</div><div class="category-list" ${collapsed ? 'hidden' : ''}>${projects.map(projectHtml).join('')}</div></section>`;
        }).join('');
      }
      if (state.petProject) {
        const fresh = state.projects.find(item => item.source_id === state.petProject.source_id);
        if (fresh) state.petProject = fresh;
      }
      if (!$('tour-coach').classList.contains('hidden')) setTimeout(() => showTourStep(false), 0);
    }

    async function refreshProjects() {
      if (state.projectMoveBusy) return;
      try {
        const previousRows = [...document.querySelectorAll('.project-row')];
        const previousCategories = new Map(previousRows.map(row => [row.dataset.source, row.dataset.category]));
        const previousRects = new Map(previousRows.map(row => [row.dataset.source, row.getBoundingClientRect()]));
        const result = await api('/api/web/progress');
        state.projects = result.recent || [];
        const unclassifiedIds = new Set(state.projects.filter(item => item.category === '已完成未分类').map(item => item.source_id));
        state.selectedProjects = new Set([...state.selectedProjects].filter(sourceId => unclassifiedIds.has(sourceId)));
        state.categories = result.categories || [];
        state.service = result.service || null;
        const categoryFilter = $('category-filter');
        const currentCategory = state.category;
        categoryFilter.innerHTML = `<option value="all">全部分类</option>${state.categories.map(category => `<option value="${esc(category)}">${esc(category)}</option>`).join('')}`;
        categoryFilter.value = state.categories.includes(currentCategory) ? currentCategory : 'all';
        renderService();
        renderProjects();
        const moved = state.projects.filter(item => previousCategories.has(item.source_id) && previousCategories.get(item.source_id) !== item.category);
        if (moved.length) animateProjectMoves(moved, previousRects);
      } catch (_error) {
        toast('项目状态暂时无法刷新');
      }
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll('.filters button').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
      renderProjects();
    }

    function setCategoryFilter(category) { state.category = category; renderProjects(); }
    function setSearch(query) { state.query = query; renderProjects(); }

    function toggleCategory(category) {
      if (state.collapsedCategories.has(category)) state.collapsedCategories.delete(category);
      else state.collapsedCategories.add(category);
      localStorage.setItem('maxreadCollapsedCategories', JSON.stringify([...state.collapsedCategories]));
      renderProjects();
    }

    function projectRow(sourceId) {
      return [...document.querySelectorAll('.project-row')].find(row => row.dataset.source === sourceId);
    }

    const movePause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

    async function animateProjectMoves(projects, previousRects) {
      if (!projects.length) return;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const groups = new Map();
      projects.forEach(project => {
        if (!groups.has(project.category)) groups.set(project.category, []);
        groups.get(project.category).push(project);
      });
      state.projectMoveBusy = true;
      try {
        for (const [category, items] of groups) {
          const categoryGroup = [...document.querySelectorAll('.category-group')].find(group => group.dataset.category === category);
          const heading = categoryGroup?.querySelector('.category-heading');
          if (!heading) continue;
          if (reduced) {
            heading.classList.add('category-arrived');
            items.forEach(item => projectRow(item.source_id)?.classList.add('project-arrived'));
            await movePause(750);
          } else {
            const before = items.map(item => previousRects.get(item.source_id)).find(Boolean);
            const helper = document.createElement('div');
            helper.className = 'max-mover';
            helper.innerHTML = `<div class="pet-sprite"></div><span>${items.length > 1 ? `${items.length} 篇 → ` : '→ '}${esc(category)}</span>`;
            const startLeft = Math.min(window.innerWidth - 78, Math.max(12, Number(before?.right || window.innerWidth / 2) - 62));
            const startTop = Math.min(window.innerHeight - 118, Math.max(16, Number(before?.top || window.innerHeight / 2)));
            helper.style.left = `${startLeft}px`;
            helper.style.top = `${startTop}px`;
            document.body.appendChild(helper);
            heading.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'nearest'});
            await movePause(520);
            const destination = heading.getBoundingClientRect();
            const endLeft = Math.min(window.innerWidth - 78, Math.max(12, destination.right - 70));
            const endTop = Math.min(window.innerHeight - 118, Math.max(16, destination.top - 28));
            helper.style.transition = 'left 1250ms cubic-bezier(.2,.78,.2,1), top 1250ms cubic-bezier(.2,.78,.2,1), transform 1250ms ease';
            helper.style.left = `${endLeft}px`;
            helper.style.top = `${endTop}px`;
            helper.style.transform = 'scale(1.06)';
            await movePause(1280);
            heading.classList.add('category-arrived');
            items.forEach(item => projectRow(item.source_id)?.classList.add('project-arrived'));
            helper.querySelector('span').textContent = `已到 ${category}`;
            await movePause(850);
            helper.remove();
          }
          heading.classList.remove('category-arrived');
          items.forEach(item => projectRow(item.source_id)?.classList.remove('project-arrived'));
        }
      } finally {
        state.projectMoveBusy = false;
      }
    }

    function toggleProjectSelection(sourceId, selected) {
      if (selected) state.selectedProjects.add(sourceId);
      else state.selectedProjects.delete(sourceId);
      renderProjects();
    }

    function toggleAllUnclassified(selected) {
      visibleProjects().filter(project => project.category === '已完成未分类').forEach(project => {
        if (selected) state.selectedProjects.add(project.source_id);
        else state.selectedProjects.delete(project.source_id);
      });
      renderProjects();
    }

    async function organizeSelectedProjects() {
      if (!state.me?.bound) { toast('绑定飞书账号后才能自动归类'); return; }
      const sourceIds = [...state.selectedProjects];
      if (!sourceIds.length) { toast('请先选择项目'); return; }
      const button = document.querySelector('.unclassified-toolbar .organize-button');
      button.disabled = true;
      $('organize-label').textContent = '整理中';
      try {
        const result = await api('/api/web/organize', {method: 'POST', body: JSON.stringify({source_ids: sourceIds})});
        toast(result.updated ? `已整理 ${result.updated} 个项目` : '没有需要重新整理的项目');
        sourceIds.forEach(sourceId => state.selectedProjects.delete(sourceId));
        await refreshProjects();
      } catch (error) {
        toast(error.message);
      } finally {
        button.disabled = false;
        if ($('organize-label')) $('organize-label').textContent = '自动归类所选';
      }
    }

    async function projectAction(sourceId, action, value) {
      return api('/api/web/project-action', {method: 'POST', body: JSON.stringify({source_id: sourceId, action, value})});
    }

    async function toggleFavorite(sourceId, favorite) {
      try {
        await projectAction(sourceId, 'favorite', favorite);
        await refreshProjects();
      } catch (error) { toast(error.message); }
    }

    async function changeCategory(sourceId, category) {
      try {
        await projectAction(sourceId, 'category', category);
        await refreshProjects();
      } catch (error) { toast(error.message); }
    }

    async function deleteProject(sourceId) {
      if (!window.confirm('从你的项目台删除这篇论文？如果它仍在独占排队，会同时安全取消。')) return;
      try {
        const result = await projectAction(sourceId, 'delete', true);
        if (state.petProject?.source_id === sourceId) closePet();
        toast(result.cancelled ? '项目已删除并取消排队' : '项目已从个人控制台删除');
        await refreshProjects();
      } catch (error) { toast(error.message); }
    }

    function updateSubmitMeta() {
      const text = $('paper-input').value;
      const count = new Set([...text.matchAll(/\b\d{4}\.\d{4,5}\b/g)].map(match => match[0])).size;
      $('submit-meta').textContent = count ? `识别到 ${count} 篇论文` : '支持 arXiv、HuggingFace Papers 和 papers.cool';
    }

    async function submitPapers() {
      const input = $('paper-input');
      const content = input.value.trim();
      if (!content) return;
      const button = $('submit-button');
      button.disabled = true;
      try {
        const result = await api('/api/web/submit', {method: 'POST', body: JSON.stringify({content})});
        const cached = result.items.filter(item => item.cached).length;
        toast(cached === result.items.length ? '项目已有可用文档' : '项目已加入队列');
        input.value = '';
        updateSubmitMeta();
        await refreshProjects();
      } catch (error) {
        toast(error.message);
      } finally {
        button.disabled = false;
      }
    }

    async function retryProject(jobId, button) {
      button.disabled = true;
      try {
        await api('/api/web/retry', {method: 'POST', body: JSON.stringify({job_id: jobId})});
        toast('项目已重新进入处理流程');
        await refreshProjects();
      } catch (error) {
        toast(error.message);
        button.disabled = false;
      }
    }

    function projectByRef(jobId, sourceId) {
      return state.projects.find(item => (jobId && Number(item.job_id) === Number(jobId)) || item.source_id === sourceId);
    }

    function openPet(jobId, sourceId) {
      if (state.petBusy) { toast('Max 还在回答当前项目'); return; }
      state.petProject = projectByRef(jobId, sourceId);
      if (!state.petProject) return;
      $('pet-project-title').textContent = `${state.petProject.source_id} · ${state.petProject.label || stateLabel(state.petProject.status)}`;
      $('pet-panel-avatar').style.backgroundPosition = state.petProject.status === 'done' ? '100% 0' : state.petProject.status === 'running' ? '33.333% 0' : state.petProject.status === 'queued' ? '66.666% 0' : '0 0';
      const key = state.petProject.source_id;
      if (!state.petChats[key]) {
        state.petChats[key] = [{role: 'assistant', content: `已连接到这个项目。当前阶段：${state.petProject.label || stateLabel(state.petProject.status)}。`}];
      }
      renderPetChat();
      $('pet-panel').classList.remove('hidden');
      $('pet-input').focus();
    }

    const tourDefinitions = [
      {
        selector: '[data-guide="submit"]',
        title: '先把论文交给我',
        text: '在输入框粘贴 arXiv 链接或论文 ID，也支持 HuggingFace Papers 和 papers.cool。可以一行放一篇；确认下方识别数量后，点右侧“开始阅读”。',
      },
      {
        selector: '[data-guide="progress"]',
        title: '在同一张卡上看进度',
        text: '提交后，论文会进入“进行中”。这里显示当前阶段、完成比例和预计时间；阶段变化会原位更新，不会连续新增消息卡片。',
      },
      {
        selector: '[data-guide="project-pet"]',
        title: '点这里询问当前论文',
        text: '处理中项目右侧会有“问 Max”。点它以后，我会自动知道你问的是哪篇论文；可以直接问“到哪了”“还要多久”或“为什么卡住”。',
      },
      {
        selector: '[data-guide="retry"]',
        title: '失败时从这里重试',
        text: '只有未完成任务才显示“重试”。点一次即可从可复用检查点继续；不要连续点击，卡片状态变成处理中就表示已经接收。',
      },
      {
        selector: '[data-guide="project-actions"]',
        title: '文档和项目操作都在卡片底部',
        text: '完成后从这里打开飞书文档，也可以手动调整分类、收藏或移出项目台。垃圾桶只移除你看到的项目，不会删除已经生成的飞书文档。',
      },
      {
        selector: '[data-guide="organize"]',
        title: '完成后再批量归类',
        text: '已完成论文先进入“已完成未分类”。先勾选要整理的卡片或点“全选”，再点“自动归类所选”。这个功能需要先绑定飞书账号。',
      },
      {
        selector: '[data-guide="category-heading"]',
        title: '点分类标题折叠项目',
        text: '分类标题右侧是该类论文数量。点击整行标题可以折叠或展开，适合项目较多时快速收起暂时不看的主题。',
      },
      {
        selector: '[data-guide="project-tools"]',
        title: '用这里快速找到论文',
        text: '搜索框按标题或 arXiv ID 查找；分类下拉框限定主题；“收藏、进行中、已完成”用于切换状态视图。问号按钮可以随时重新启动本导览。',
      },
      {
        selector: '[data-guide="pipeline"]',
        title: '想看系统怎么处理论文',
        text: '点“Pipeline 架构”可以查看从下载、生成、内容审阅、格式质检到视觉验收的完整状态机，以及失败后会走哪条修复或重试路径。普通用户也可以直接查看。',
      },
      {
        selector: '[data-guide="account"]',
        title: '最后绑定你的飞书身份',
        text: '点右上角“游客”，页面会生成一条 10 分钟有效的绑定指令。点复制，打开飞书并私聊“读不动了”，发送完整指令；再回到本页等待自动显示你的姓名，不需要刷新。绑定后网页与飞书任务会合并，并解锁批量归类。',
      },
    ];

    function visibleTourTarget(selector) {
      return [...document.querySelectorAll(selector)].find(element => {
        const rect = element.getBoundingClientRect();
        return element.getClientRects().length && rect.width > 0 && rect.height > 0;
      }) || null;
    }

    function clearTourTarget() {
      document.querySelectorAll('.tour-target').forEach(element => element.classList.remove('tour-target'));
      state.tourTarget = null;
    }

    function positionTourCoach() {
      const target = state.tourTarget;
      const coach = $('tour-coach');
      if (!target || coach.classList.contains('hidden')) return;
      const rect = target.getBoundingClientRect();
      const coachRect = coach.getBoundingClientRect();
      const gap = 14;
      const margin = 12;
      let left = Math.min(Math.max(margin, rect.left), window.innerWidth - coachRect.width - margin);
      let top = rect.bottom + gap;
      if (top + coachRect.height > window.innerHeight - margin) top = rect.top - coachRect.height - gap;
      if (top < margin) top = Math.min(window.innerHeight - coachRect.height - margin, Math.max(margin, rect.bottom + gap));
      coach.style.left = `${Math.max(margin, left)}px`;
      coach.style.top = `${Math.max(margin, top)}px`;
    }

    function showTourStep(scroll = true) {
      clearTourTarget();
      const step = state.tourSteps[state.tourStep];
      if (!step) { stopPageTour(); return; }
      const target = visibleTourTarget(step.selector);
      if (!target) {
        state.tourSteps.splice(state.tourStep, 1);
        showTourStep(scroll);
        return;
      }
      state.tourTarget = target;
      target.classList.add('tour-target');
      $('tour-title').textContent = step.title;
      $('tour-text').textContent = step.text;
      $('tour-counter').textContent = `MAX 使用向导 · ${state.tourStep + 1}/${state.tourSteps.length}`;
      $('tour-previous').disabled = state.tourStep === 0;
      $('tour-next').textContent = state.tourStep === state.tourSteps.length - 1 ? '完成' : '下一步';
      $('tour-backdrop').classList.remove('hidden');
      $('tour-coach').classList.remove('hidden');
      if (scroll) target.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'nearest'});
      setTimeout(positionTourCoach, scroll ? 280 : 0);
    }

    function startPageTour() {
      closePet();
      state.tourSteps = tourDefinitions.filter(step => visibleTourTarget(step.selector));
      state.tourStep = 0;
      if (!state.tourSteps.length) { toast('页面还在加载，请稍后再试'); return; }
      showTourStep();
    }

    function startBindingTour() {
      closePet();
      const accountStep = tourDefinitions.find(step => step.selector === '[data-guide="account"]');
      state.tourSteps = accountStep ? [accountStep] : [];
      state.tourStep = 0;
      showTourStep();
    }

    function stopPageTour() {
      clearTourTarget();
      $('tour-backdrop').classList.add('hidden');
      $('tour-coach').classList.add('hidden');
      localStorage.setItem('maxreadProjectOnboardingSeen', '1');
    }

    function previousTourStep() {
      if (state.tourStep > 0) state.tourStep -= 1;
      showTourStep();
    }

    function nextTourStep() {
      if (state.tourStep >= state.tourSteps.length - 1) { stopPageTour(); return; }
      state.tourStep += 1;
      showTourStep();
    }

    function showButtonGuide() { startPageTour(); }

    function closePet() { $('pet-panel').classList.add('hidden'); }
    function renderPetChat() {
      if (!state.petProject) return;
      const rows = state.petChats[state.petProject.source_id] || [];
      $('pet-chat').innerHTML = rows.map(item => `<div class="pet-message ${esc(item.role)}"><div class="pet-bubble">${item.pending ? '<span class="pet-pending">Max 正在思考<span class="thinking-dots"><i></i><i></i><i></i></span></span>' : esc(item.content)}</div></div>`).join('');
      $('pet-chat').scrollTop = $('pet-chat').scrollHeight;
    }

    async function askPet(content) {
      if (!state.petProject || !content.trim() || state.petBusy) return;
      if (/绑定.*飞书|飞书.*绑定/.test(content)) {
        startBindingTour();
        return;
      }
      if (/按钮|页面怎么用|项目台怎么用|使用方法|新手指引|带我看/.test(content)) {
        startPageTour();
        return;
      }
      const key = state.petProject.source_id;
      const chat = state.petChats[key] || (state.petChats[key] = []);
      chat.push({role: 'user', content: content.trim()});
      const pending = {role: 'assistant', content: '', pending: true};
      chat.push(pending);
      state.petBusy = true;
      $('pet-panel-avatar').style.backgroundPosition = '66.666% 0';
      document.querySelectorAll('#pet-quick button').forEach(button => { button.disabled = true; });
      renderPetChat();
      $('pet-send').disabled = true;
      try {
        const result = await api('/api/web/pet/chat', {
          method: 'POST',
          body: JSON.stringify({
            content: content.trim(),
            job_id: Number(state.petProject.job_id || 0),
            source_id: state.petProject.guide ? '' : state.petProject.source_id,
            history: chat.filter(item => !item.pending).slice(-8, -1),
          }),
        });
        Object.assign(pending, {content: result.message?.content || '我还在看这个项目。', pending: false});
      } catch (error) {
        Object.assign(pending, {content: error.message, pending: false});
      } finally {
        state.petBusy = false;
        const frame = petFrame(state.petProject);
        $('pet-panel-avatar').style.backgroundPosition = frame === 'done' ? '100% 0' : frame === 'working' ? '33.333% 0' : frame === 'thinking' ? '66.666% 0' : '0 0';
        document.querySelectorAll('#pet-quick button').forEach(button => { button.disabled = false; });
        $('pet-send').disabled = false;
        renderPetChat();
      }
    }

    function sendPetMessage() {
      const input = $('pet-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      askPet(content);
    }

    async function loadAdminAccounts() {
      try {
        const status = await api('/api/admin/status');
        state.adminAuthenticated = Boolean(status.authenticated);
        if (!state.adminAuthenticated) return '';
        const accounts = await api('/api/web/admin/accounts');
        return `<div class="admin-switch"><label for="admin-account">管理员代入用户</label><select id="admin-account" onchange="setActAs(this.value)"><option value="">我的网页身份</option>${accounts.map(account => `<option value="${esc(account.public_id)}" ${account.public_id === state.actAs ? 'selected' : ''}>${esc(account.display_name || '游客')} · ${esc(account.account_type)}</option>`).join('')}</select></div>`;
      } catch (_error) {
        return '';
      }
    }

    async function setActAs(publicId) {
      state.actAs = publicId;
      if (publicId) sessionStorage.setItem('maxreadActAs', publicId); else sessionStorage.removeItem('maxreadActAs');
      closePet();
      await loadMe();
      await refreshProjects();
      closeAccount();
      toast(publicId ? '已进入用户项目视图' : '已退出用户项目视图');
    }

    async function openAccount() {
      $('binding-error').textContent = '';
      $('account-dialog').showModal();
      const admin = await loadAdminAccounts();
      if (state.me?.acting_as) {
        $('account-title').textContent = '管理员代入态';
        $('account-content').innerHTML = `<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>当前只显示该用户的项目</span></div>${admin}`;
        return;
      }
      if (state.me?.bound) {
        $('account-title').textContent = '飞书账号';
        $('account-content').innerHTML = `<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>网页与飞书提交共享同一组项目</span></div>${admin}`;
        return;
      }
      $('account-title').textContent = '绑定飞书账号';
      $('account-content').innerHTML = '<div class="bind-copy">正在生成绑定码...</div>';
      try {
        const data = await api('/api/web/binding-code', {method: 'POST', body: '{}'});
        $('account-content').innerHTML = `<div class="bind-copy">1. 点右侧复制按钮。<br>2. 打开飞书，私聊「读不动了」。<br>3. 发送下面这条完整指令。<br>4. 回到本页等待姓名自动出现，不需要刷新。</div><div class="command"><code>${esc(data.command)}</code><button class="copy" aria-label="复制绑定指令" title="复制绑定指令" onclick="copyCommand('${esc(data.command)}')">${icon('copy')}</button></div><div class="expires">绑定指令 10 分钟内有效；绑定后网页与飞书任务会合并到同一账号。</div>${admin}`;
        pollBinding();
      } catch (error) {
        $('binding-error').textContent = error.message;
      }
    }

    function closeAccount() { $('account-dialog').close(); }
    async function copyCommand(command) { await navigator.clipboard.writeText(command); toast('已复制'); }
    async function pollBinding() {
      for (let index = 0; index < 120 && $('account-dialog').open; index += 1) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        await loadMe();
        if (state.me.bound) {
          $('account-title').textContent = '绑定成功';
          $('account-content').innerHTML = `<div class="bound-box"><strong>${esc(state.me.display_name)}</strong><br><span>个人项目已经与飞书账号合并</span></div>`;
          await refreshProjects();
          return;
        }
      }
    }

    function maybeOnboard() {
      if (!localStorage.getItem('maxreadProjectOnboardingSeen')) setTimeout(startPageTour, 500);
    }

    $('paper-input').addEventListener('input', updateSubmitMeta);
    $('paper-input').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitPapers(); } });
    $('pet-input').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendPetMessage(); } });
    window.addEventListener('resize', positionTourCoach);
    window.addEventListener('scroll', positionTourCoach, {passive: true});
    window.addEventListener('keydown', event => { if (event.key === 'Escape' && !$('tour-coach').classList.contains('hidden')) stopPageTour(); });

    async function boot() {
      await Promise.all([loadMe(), loadAdminContext()]);
      await refreshProjects();
      state.poll = setInterval(refreshProjects, 4000);
      maybeOnboard();
    }
    boot().catch(() => toast('页面初始化失败'));
  </script>
</body>
</html>
