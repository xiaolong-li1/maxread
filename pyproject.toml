[project]
name = "maxread"
version = "0.1.0"
description = "Local MVP for 读不动了 / MaxRead: arXiv to Feishu docx summaries."
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10",
    "PyMuPDF>=1.24",
    "pypdf>=5",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49",
]

[project.scripts]
maxread = "maxread.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maxread*"]
exclude = ["tests*", "deploy*"]

[tool.setuptools.package-data]
maxread = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
